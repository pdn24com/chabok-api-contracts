openapi: 3.1.0
info:
  title: Chabok IAM Sprint 0 API
  version: 1.0.0-approved-readiness
  description: |
    Approved implementation-readiness contract derived from Chabok IAM Sprint 0
    API Contract v1.1. The operation inventory remains exactly the 34 supplied
    operations. S0-01 through S0-03 are implemented; S0-04 through S0-06
    remain blocked pending their separately authorized implementation stages.
servers:
  - url: /api/v1
tags:
  - name: Authentication
  - name: Current User
  - name: Context
  - name: Users
  - name: Roles
  - name: Permissions
  - name: Assignments
  - name: Entitlements
security:
  - bearerAuth: []
x-chabok-branch-web-security:
  extension: IAM-EXT-012
  deployment: same-site
  transport: TLS is required for all authentication, OTP, invitation, and temporary-password requests.
  origin_validation: Refresh, logout, and logout-all require an exact configured Branch Panel Origin.
  credentialed_cors: Allowed only for explicitly configured origins; wildcard credentialed origins are prohibited.
  negative_tests: Missing and foreign Origin, unconfigured credentialed CORS, and SameSite regressions block release.
  csrf_change_control: A cross-site deployment requires a separately approved additional CSRF token mechanism.
x-chabok-forced-password-session:
  extension: IAM-EXT-011
  allowed_operation_ids: [changePassword, refreshSession, logout, logoutAll]
  prohibited_status: 403
  prohibited_error_code: PASSWORD_CHANGE_REQUIRED
  description: Every other protected operation is denied while must_change_password is true.
paths:
  /iam/assignment-options:
    get:
      tags: [Assignments]
      operationId: getAssignmentOptions
      parameters:
        - name: role_id
          in: query
          description: Further restrict scopes to those covering every permission of this role.
          schema: { type: string, format: uuid }
      summary: List named delegation scopes with hierarchical area paths
      description: Options are bounded by the caller's role-assignment authority. Every write independently validates the permission bundle and scope including descendants.
      responses:
        '200':
          description: Allowed scopes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DataEnvelopeBase'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AssignmentOptions' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /iam/users/{user_id}/operational-profile:
    post:
      tags: [Users]
      operationId: attachOperationalProfile
      summary: Create or link an operational profile to an existing user atomically
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [operational_profile]
              properties:
                operational_profile: { $ref: '#/components/schemas/OperationalProfileInput' }
      responses:
        '200':
          description: Profile attached and optional Node assignment created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DataEnvelopeBase'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          driver_profile: { $ref: '#/components/schemas/DriverProfileReference' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Log in with a globally unique username, mobile, or email
      security: []
      x-chabok-source: IAM API v1.1 sections 2.1 and 9.1
      x-chabok-approval-status: locked
      x-chabok-backlog-status: sprint-0-must
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Access token and current context; refresh token is set only as an HttpOnly cookie
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccess'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshSession
      summary: Rotate the Branch Panel web refresh cookie and issue an access token
      security:
        - refreshCookie: []
      x-chabok-source: IAM API v1.1 section 2 plus current Branch Panel web amendment
      x-chabok-approval-status: locked-IAM-EXT-012
      x-chabok-backlog-status: sprint-0-must
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/NodeId'
        - $ref: '#/components/parameters/BranchPanelOrigin'
      responses:
        '200':
          description: Rotated session; no refresh token is returned in JSON
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenSuccess'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/OriginForbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke the current session and expire the Branch Panel refresh cookie
      description: A valid refresh cookie may authenticate this command when the access token has expired. Origin validation occurs before revocation or cookie-clearing response handling.
      security:
        - refreshCookie: []
        - bearerAuth: []
      x-chabok-source: IAM API v1.1 section 2 plus IAM-EXT-012 and IAM-EXT-013
      x-chabok-approval-status: locked-IAM-EXT-012-IAM-EXT-013
      x-chabok-backlog-status: sprint-0-must
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/NodeId'
        - $ref: '#/components/parameters/BranchPanelOrigin'
      responses:
        '200':
          description: Session revoked or already unavailable; refresh cookie expired
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            Set-Cookie:
              $ref: '#/components/headers/ClearRefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessFlagEnvelope'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/OriginForbidden'
  /auth/logout-all:
    post:
      tags: [Authentication]
      operationId: logoutAll
      summary: Revoke all current-user sessions and expire the Branch Panel refresh cookie
      security:
        - refreshCookie: []
        - bearerAuth: []
      x-chabok-source: IAM API v1.1 section 2 plus IAM-EXT-012 and IAM-EXT-013
      x-chabok-approval-status: locked-IAM-EXT-012-IAM-EXT-013
      x-chabok-backlog-status: sprint-0-must
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/NodeId'
        - $ref: '#/components/parameters/BranchPanelOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutAllRequest'
      responses:
        '200':
          description: Sessions revoked
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            Set-Cookie:
              $ref: '#/components/headers/ClearRefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokedCountSuccess'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/OriginForbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /auth/otp/send:
    post:
      tags: [Authentication]
      operationId: sendOtp
      summary: Send an activation or password-reset OTP
      description: For password recovery, known and unknown identifiers receive externally equivalent safe responses and comparable work/timing. The response never confirms account existence or delivery.
      security: []
      x-chabok-source: IAM API v1.1 section 2 plus IAM-EXT-015
      x-chabok-approval-status: locked-IAM-EXT-015
      x-chabok-account-enumeration-safe: true
      x-chabok-backlog-status: sprint-0-must
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpSendRequest'
      responses:
        '200':
          description: Safe challenge acknowledgement; challenge metadata does not confirm account existence or delivery
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallengeSuccess'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/otp/verify:
    post:
      tags: [Authentication]
      operationId: verifyOtp
      summary: Verify an OTP challenge
      security: []
      x-chabok-source: IAM API v1.1 section 2
      x-chabok-approval-status: locked
      x-chabok-backlog-status: sprint-0-must
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
      responses:
        '200':
          description: Verification token issued
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationTokenSuccess'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/password/activate:
    post:
      tags: [Authentication]
      operationId: activatePassword
      summary: Set an initial password using a verification or invitation token
      security: []
      x-chabok-source: IAM API v1.1 section 2 plus IAM-EXT-014
      x-chabok-approval-status: locked-backend-endpoint-IAM-EXT-014
      x-chabok-backlog-status: sprint-0-must
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      description: This backend endpoint does not authorize an invitation-acceptance Branch Panel screen.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordActivateRequest'
      responses:
        '200':
          description: User activated
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStatusSuccess'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /auth/password/reset:
    post:
      tags: [Authentication]
      operationId: resetPassword
      summary: Reset password and revoke existing sessions
      security: []
      x-chabok-source: IAM API v1.1 section 2
      x-chabok-approval-status: locked
      x-chabok-backlog-status: sprint-0-must
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          description: Password reset
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokedCountSuccess'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /auth/password/change:
    post:
      tags: [Authentication]
      operationId: changePassword
      summary: Change current password and clear forced-password state
      x-chabok-source: IAM API v1.1 section 2
      x-chabok-approval-status: locked
      x-chabok-backlog-status: sprint-0-must
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/NodeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '200':
          $ref: '#/components/responses/SuccessFlag'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /me:
    get:
      tags: [Current User]
      operationId: getMe
      summary: Get current profile and effective roles
      x-chabok-source: IAM API v1.1 section 3
      x-chabok-approval-status: locked
      x-chabok-backlog-status: sprint-0-must
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/NodeId'
      responses:
        '200':
          description: Current user
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSuccess'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
  /me/context:
    get:
      tags: [Current User]
      operationId: getMyContext
      summary: Get effective permissions, scopes, nodes, and entitlements
      x-chabok-source: IAM API v1.1 sections 3.1 and 9.2
      x-chabok-approval-status: locked
      x-chabok-backlog-status: sprint-0-must
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/NodeId'
      responses:
        '200':
          description: Current authorization and operational context
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextSuccess'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
  /me/profile:
    patch:
      tags: [Current User]
      operationId: updateMyProfile
      summary: Update limited self-service profile fields
      x-chabok-source: IAM API v1.1 section 3
      x-chabok-approval-status: locked-IAM-EXT-003
      x-chabok-backlog-status: sprint-0-should
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/NodeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelfProfileUpdateRequest'
      responses:
        '200':
          description: Updated user
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSuccess'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /me/sessions:
    get:
      tags: [Current User]
      operationId: listMySessions
      summary: List current-user sessions without token hashes
      x-chabok-source: IAM API v1.1 section 3
      x-chabok-approval-status: locked
      x-chabok-backlog-status: sprint-0-must
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/NodeId'
      responses:
        '200':
          description: Sessions
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListSuccess'
  /me/sessions/{session_id}:
    delete:
      tags: [Current User]
      operationId: revokeMySession
      summary: Revoke one owned session
      x-chabok-source: IAM API v1.1 section 3
      x-chabok-approval-status: locked
      x-chabok-backlog-status: sprint-0-must
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/NodeId'
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          $ref: '#/components/responses/SuccessFlag'
        '403':
          $ref: '#/components/responses/Forbidden'
  /context/nodes:
    get:
      tags: [Context]
      operationId: listAccessibleNodes
      summary: List nodes accessible through assignments and area descendants
      x-chabok-source: IAM API v1.1 section 3
      x-chabok-approval-status: locked
      x-required-permission: node_context.view
      x-chabok-backlog-status: sprint-0-must
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/NodeId'
      responses:
        '200':
          description: Accessible nodes
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeListSuccess'
        '403':
          $ref: '#/components/responses/Forbidden'
  /iam/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List and filter users within administrative authority
      x-chabok-source: IAM API v1.1 section 4
      x-chabok-approval-status: locked
      x-required-permission: iam.users.view
      x-chabok-backlog-status: sprint-0-backend-must-ui-deferred
      parameters:
        - name: node_id
          in: query
          description: Users with effective active assignments covering this node, including area and tenant assignments.
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/NodeId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/UserStatus'
        - name: role_code
          in: query
          schema:
            type: string
        - name: scope_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Users
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListSuccess'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Users]
      operationId: createUser
      summary: Create a Direct Active or Invited user
      description: DIRECT_ACTIVE requires a caller-supplied policy-valid temporary password over TLS and sets must_change_password=true. Invitation modes reject temporary_password and use activation; no password is returned.
      x-chabok-source: IAM API v1.1 sections 4 and 4.1 plus IAM-EXT-006
      x-chabok-approval-status: locked-IAM-EXT-006
      x-required-permission: iam.users.manage
      x-chabok-backlog-status: sprint-0-must
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/NodeId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSuccess'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /iam/users/{user_id}:
    get:
      tags: [Users]
      operationId: getUser
      summary: Get user, assignments, invitation state, and session summary
      x-chabok-source: IAM API v1.1 section 4
      x-chabok-approval-status: locked
      x-required-permission: iam.users.view
      x-chabok-backlog-status: sprint-0-backend-must-ui-deferred
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/NodeId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetailSuccess'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [Users]
      operationId: updateUser
      summary: Update allowed user profile fields
      description: Only first_name, last_name, and display_name are mutable. Username, mobile, and email require a later verified-identifier workflow.
      x-chabok-source: IAM API v1.1 section 4 plus IAM-EXT-004
      x-chabok-approval-status: locked-IAM-EXT-004
      x-required-permission: iam.users.manage
      x-chabok-backlog-status: sprint-0-backend-must-ui-deferred
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/NodeId'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserUpdateRequest'
      responses:
        '200':
          description: Updated user
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSuccess'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /iam/users/{user_id}/suspend:
    post:
      tags: [Users]
      operationId: suspendUser
      summary: Suspend a user and revoke sessions
      x-chabok-source: IAM API v1.1 section 4
      x-chabok-approval-status: locked
      x-required-permission: iam.users.manage
      x-chabok-backlog-status: sprint-0-must
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/NodeId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          $ref: '#/components/responses/UserStatusChanged'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /iam/users/{user_id}/activate:
    post:
      tags: [Users]
      operationId: activateUser
      summary: Activate or reactivate a user
      x-chabok-source: IAM API v1.1 section 4
      x-chabok-approval-status: locked
      x-required-permission: iam.users.manage
      x-chabok-backlog-status: sprint-0-must
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/NodeId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          $ref: '#/components/responses/UserStatusChanged'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /iam/users/{user_id}/deactivate:
    post:
      tags: [Users]
      operationId: deactivateUser
      summary: Deactivate a user and revoke sessions
      x-chabok-source: IAM API v1.1 section 4
      x-chabok-approval-status: locked
      x-required-permission: iam.users.manage
      x-chabok-backlog-status: sprint-0-must
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/NodeId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          $ref: '#/components/responses/UserStatusChanged'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /iam/users/{user_id}/invite:
    post:
      tags: [Users]
      operationId: inviteUser
      summary: Send or resend an SMS/email invitation
      x-chabok-source: IAM API v1.1 section 4
      x-chabok-approval-status: locked-IAM-EXT-005
      x-required-permission: iam.users.manage
      x-chabok-backlog-status: sprint-0-must
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/NodeId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteUserRequest'
      responses:
        '200':

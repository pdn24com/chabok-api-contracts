      required: [temporary_password]
      properties:
        temporary_password:
          type: string
          format: password
          description: Caller-supplied TLS-only secret validated against the active password policy; never returned or logged
    RoleMenuKeys:
      type: [array, 'null']
      uniqueItems: true
      maxItems: 27
      description: Sidebar visibility preference, never an operation grant. Null means automatic permission-derived navigation; an empty array hides all configurable sidebar leaves. Omitted on create uses null, on update preserves, on clone inherits. Effective context unions active explicit roles; any automatic role yields null. Existing permission and entitlement gates still apply.
      items:
        type: string
        enum: [dashboard, consignments, manifests, users, roles, entitlements, operational-statuses, consignment-number-ranges, service-catalog-overview, service-catalog-service-types, service-catalog-shipping-methods, service-catalog-offerings, service-catalog-options, service-catalog-commitment-schedules, pricing-overview, pricing-tariffs, pricing-zones, pricing-charge-types, pricing-simulator, network-areas, network-nodes, network-coverage, network-routes, fleet-drivers, fleet-vehicles, profile, sessions]
    RoleCreateRequest:
      type: object
      additionalProperties: false
      required: [role_code, role_title, permission_codes]
      properties:
        menu_keys:
          $ref: '#/components/schemas/RoleMenuKeys'
        role_code:
          type: string
          maxLength: 120
          pattern: '^[a-z][a-z0-9_.-]+$'
        role_title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, 'null']
          maxLength: 500
        permission_codes:
          type: array
          uniqueItems: true
          items:
            type: string
    RoleCloneRequest:
      type: object
      additionalProperties: false
      x-chabok-approval-status: approved-IAM-EXT-007
      required: [role_code, role_title]
      properties:
        menu_keys:
          $ref: '#/components/schemas/RoleMenuKeys'
        role_code:
          type: string
          maxLength: 120
          pattern: '^[a-z][a-z0-9_.-]+$'
        role_title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, 'null']
          maxLength: 500
        permission_codes:
          type: array
          uniqueItems: true
          items:
            type: string
    RoleUpdateRequest:
      type: object
      additionalProperties: false
      x-chabok-approval-status: approved-IAM-EXT-007
      description: role_code is immutable. Optional permission_codes replaces grants atomically with metadata; empty array clears grants. Requires tenant-wide management and delegation authority. No manual version field.
      minProperties: 1
      properties:
        menu_keys:
          $ref: '#/components/schemas/RoleMenuKeys'
        role_title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, 'null']
          maxLength: 500
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        permission_codes:
          type: array
          uniqueItems: true
          items:
            type: string
    ReplaceRolePermissionsRequest:
      type: object
      additionalProperties: false
      x-chabok-approval-status: approved-IAM-EXT-008
      required: [permission_codes]
      properties:
        permission_codes:
          type: array
          uniqueItems: true
          description: An explicitly supplied empty array intentionally clears a custom role's grants subject to authorization, audit, and concurrency controls.
          items:
            type: string
    CreateAssignmentsRequest:
      type: object
      additionalProperties: false
      x-chabok-approval-status: approved-IAM-EXT-009
      required: [assignments]
      properties:
        assignments:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AssignmentInput'
    CreateUserRequest:
      type: object
      additionalProperties: false
      x-chabok-approval-status: approved-IAM-EXT-006
      required: [creation_mode, first_name, last_name, assignments]
      properties:
        operational_profile: { $ref: '#/components/schemas/OperationalProfileInput' }
        creation_mode:
          type: string
          enum: [DIRECT_ACTIVE, SMS_INVITATION, EMAIL_INVITATION]
        username:
          type: string
        mobile:
          type: string
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        temporary_password:
          type: string
          format: password
          description: Required only for DIRECT_ACTIVE; validated against policy, never returned/logged, and sets must_change_password=true
        assignments:
          type: array
          minItems: 0
          maxItems: 50
          description: At least one assignment must exist after composing any Node profile assignment.
          items:
            $ref: '#/components/schemas/AssignmentInput'
      anyOf:
        - required: [username]
        - required: [mobile]
        - required: [email]
      oneOf:
        - properties:
            creation_mode:
              const: DIRECT_ACTIVE
          required: [temporary_password]
        - properties:
            creation_mode:
              const: SMS_INVITATION
          required: [mobile]
          not:
            required: [temporary_password]
        - properties:
            creation_mode:
              const: EMAIL_INVITATION
          required: [email]
          not:
            required: [temporary_password]
    AssignmentInput:
      type: object

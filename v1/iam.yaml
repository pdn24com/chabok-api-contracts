components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: chabok_refresh
      description: Secure, HttpOnly, SameSite rotating opaque token for Branch Panel web
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: Optional UUID propagated or replaced by a server-generated value; the response header and body correlation_id agree
      schema:
        type: string
        format: uuid
    NodeId:
      name: X-Node-Id
      in: header
      required: false
      description: Optional operational context hint validated against authenticated access; never establishes or overrides tenant identity
      schema:
        type: string
        format: uuid
    BranchPanelOrigin:
      name: Origin
      in: header
      required: true
      description: Must exactly match an explicitly configured Branch Panel origin; validated before cookie-authenticated command handling
      schema:
        type: string
        format: uri
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoleId:
      name: role_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssignmentId:
      name: assignment_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Search:
      name: search
      in: query
      schema:
        type: string
        maxLength: 200
  headers:
    CorrelationId:
      description: Accepted or generated correlation UUID; agrees with the response body correlation_id
      required: true
      schema:
        type: string
        format: uuid
    RefreshCookie:
      description: Rotating Branch Panel refresh cookie; never exposed to JavaScript
      schema:
        type: string
        example: chabok_refresh=opaque; Path=/api/v1/auth; Secure; HttpOnly; SameSite=Lax
    ClearRefreshCookie:
      description: Expire the Branch Panel refresh cookie using the same name, path, security attributes, and SameSite policy
      schema:
        type: string
        example: chabok_refresh=; Path=/api/v1/auth; Max-Age=0; Expires=Thu, 01 Jan 1970 00:00:00 GMT; Secure; HttpOnly; SameSite=Lax
  responses:
    InvalidCredentials:
      description: Unknown identifier and wrong password use the same public response
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error_code: INVALID_CREDENTIALS
            message: Invalid credentials.
            field_errors: {}
            details: {}
            correlation_id: 018f77b6-7c5e-7c39-b4e2-111111111111
    AuthenticationRequired:
      description: Authentication required, session revoked, or refresh-token reuse detected; the specific reuse cause is restricted to safe internal telemetry
      x-chabok-error-codes:
        - AUTHENTICATION_REQUIRED
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Inactive user, tenant, entitlement, permission, scope denial, or 403 PASSWORD_CHANGE_REQUIRED for a restricted forced-password session
      x-chabok-error-codes:
        - PASSWORD_CHANGE_REQUIRED
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    OriginForbidden:
      description: Missing or unconfigured Origin; no credentialed CORS permission is emitted
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Identifier, idempotency, or concurrency conflict
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unprocessable:
      description: Validation, lifecycle, or domain-policy rejection
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: Rate limit exceeded
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    SuccessFlag:
      description: Command succeeded
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessFlagEnvelope'
    UserStatusChanged:
      description: User lifecycle status changed
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserStatusSuccess'
  schemas:
    AssignmentOptions:
      type: object
      required: [tenant_allowed, areas, nodes]
      properties:
        tenant_allowed: { type: boolean }
        areas:
          type: array
          items:
            type: object
            required: [area_id, area_title, path, can_include_descendants]
            properties:
              area_id: { type: string, format: uuid }
              area_title: { type: string }
              path: { type: string }
              can_include_descendants: { type: boolean }
        nodes:
          type: array
          items:
            type: object
            required: [node_id, node_title, node_code, node_type, area_id]
            properties:
              node_id: { type: string, format: uuid }
              node_title: { type: string }
              node_code: { type: string }
              node_type: { type: string }
              area_id: { type: string, format: uuid }
    OnboardingDriver:
      type: object
      additionalProperties: false
      required: [driver_code, display_name, home_node_id, capabilities]
      properties:
        driver_code: { type: string, maxLength: 80 }
        display_name: { type: string, maxLength: 200 }
        home_node_id: { type: string, format: uuid }
        mobile: { type: [string, 'null'], maxLength: 32 }
        capabilities:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [PICKUP, LINEHAUL, DELIVERY] }
    OperationalProfileInput:
      description: Atomically create/link a Driver or create/link a Node and assign its role. Operational identity is independent of roles. All owning-module permissions and scope rules apply.
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, mode, driver]
          properties:
            kind: { type: string, const: DRIVER }
            mode: { type: string, const: CREATE }
            driver: { $ref: '#/components/schemas/OnboardingDriver' }
        - type: object
          additionalProperties: false
          required: [kind, mode, existing_id, expected_version]
          properties:
            kind: { type: string, const: DRIVER }
            mode: { type: string, const: LINK }
            existing_id: { type: string, format: uuid }
            expected_version: { type: integer, minimum: 1 }
        - type: object
          additionalProperties: false
          required: [kind, mode, role_id, node]
          properties:
            kind: { type: string, const: NODE }
            mode: { type: string, const: CREATE }
            role_id: { type: string, format: uuid }
            node: { $ref: './network.yaml#/components/schemas/CreateNodeRequest' }
        - type: object
          additionalProperties: false
          required: [kind, mode, role_id, existing_id]
          properties:
            kind: { type: string, const: NODE }
            mode: { type: string, const: LINK }
            role_id: { type: string, format: uuid }
            existing_id: { type: string, format: uuid }
    DriverProfileReference:
      type: [object, 'null']
      required: [driver_id, driver_code, display_name, home_node_id, status]
      properties:
        driver_id: { type: string, format: uuid }
        driver_code: { type: string }
        display_name: { type: string }
        home_node_id: { type: string, format: uuid }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [identifier, password]
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 1
        client_type:
          type: string
          const: BRANCH_PANEL
          default: BRANCH_PANEL
        device_id:
          type: string
          maxLength: 200
        device_name:
          type: string
          maxLength: 200
    LogoutAllRequest:
      type: object
      additionalProperties: false
      properties:
        current_password:
          type: string
          format: password
        step_up_verification_token:
          type: string
      oneOf:
        - required: [current_password]
        - required: [step_up_verification_token]
    OtpSendRequest:
      type: object
      additionalProperties: false
      required: [identifier, purpose]
      properties:
        identifier:
          type: string
        purpose:
          type: string
          enum: [ACTIVATION, PASSWORD_RESET]
    OtpVerifyRequest:
      type: object
      additionalProperties: false
      required: [challenge_id, code]
      properties:
        challenge_id:
          type: string
          format: uuid
        code:
          type: string
          minLength: 4
          maxLength: 12
    PasswordActivateRequest:
      type: object
      additionalProperties: false
      description: Exactly one activation proof is required; neither-token and both-token payloads are invalid.
      required: [new_password]
      properties:
        verification_token:
          type: string
        invitation_token:
          type: string
        new_password:
          type: string
          format: password
      oneOf:
        - required: [verification_token]
          not:
            required: [invitation_token]
        - required: [invitation_token]
          not:
            required: [verification_token]
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [verification_token, new_password]
      properties:
        verification_token:
          type: string
        new_password:
          type: string
          format: password
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
    SelfProfileUpdateRequest:
      type: object
      additionalProperties: false
      x-chabok-approval-status: approved-IAM-EXT-003
      minProperties: 1
      properties:
        first_name:
          type: string
        last_name:
          type: string
        display_name:
          type: string
    AdminUserUpdateRequest:
      type: object
      additionalProperties: false
      x-chabok-approval-status: approved-IAM-EXT-004
      minProperties: 1
      properties:
        first_name:
          type: string
        last_name:
          type: string
        display_name:
          type: string
    InviteUserRequest:
      type: object

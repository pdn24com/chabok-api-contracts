components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
        format: uuid
    OpportunityId:
      name: opportunityId
      in: path
      required: true
      schema:
        type: integer
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: integer
    VersionId:
      name: versionId
      in: path
      required: true
      schema:
        type: integer
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: integer
    EntryId:
      name: entryId
      in: path
      required: true
      schema:
        type: integer
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional; length is validated (422 if invalid).
      schema:
        type: string
        minLength: 8
        maxLength: 255
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: integer
    TeamId:
      name: teamId
      in: path
      required: true
      schema:
        type: integer
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema:
        type: integer
    AddressId:
      name: addressId
      in: path
      required: true
      schema:
        type: integer
    DepartmentId:
      name: departmentId
      in: path
      required: true
      schema:
        type: integer
    PositionId:
      name: positionId
      in: path
      required: true
      schema:
        type: integer
  schemas:
    FunnelStepOutcome:
      type: string
      enum:
      - OPEN
      - WON
      - LOST
    SalesDocumentStatus:
      type: string
      enum:
      - DRAFT
      - REVIEW
      - ISSUED
      - ACCEPTED
      - CANCELLED
    SalesDocumentType:
      type: string
      enum:
      - ESTIMATE
      - PROPOSAL
      - PROFORMA
    BankAccountStatus:
      type: string
      enum:
      - ACTIVE
      - INACTIVE
    FinancialEntryKind:
      type: string
      enum:
      - REVENUE
      - RECEIPT
      - ADJUSTMENT
    TaskScope:
      type: string
      enum:
      - mine
      - accessible
    TaskBucket:
      type: string
      enum:
      - overdue
      - today
      - future
      - undated
      - waiting
      - closed
    TaskPriority:
      type: string
      enum:
      - HIGH
      - MEDIUM
      - LOW
    TaskStatus:
      type: string
      enum:
      - OPEN
      - COMPLETED
      - CANCELLED
    TaskAssignmentEventType:
      type: string
      enum:
      - CREATE
      - REFER
      - CLAIM
      - REASSIGN
    ActivityType:
      type: string
      enum:
      - CALL
      - MESSAGE
      - MEETING
      - REFERRAL
      - NOTE
    ActivityDirection:
      type: string
      enum:
      - INBOUND
      - OUTBOUND
    ActivityChannel:
      type: string
      enum:
      - PHONE
      - EMAIL
      - SMS
      - WHATSAPP
      - TELEGRAM
      - BALE
      - INSTAGRAM
      - POST
    CallOutcome:
      type: string
      enum:
      - ANSWERED
      - BUSY
    MeetingMode:
      type: string
      enum:
      - ONLINE
    TeamStatus:
      type: string
      enum:
      - ACTIVE
      - INACTIVE
    MembershipStatus:
      type: string
      enum:
      - ACTIVE
      - ENDED
    BulkMembershipOperation:
      type: string
      enum:
      - ADD
      - END
      - TRANSFER
    CustomerKind:
      type: string
      enum:
      - PERSON
      - COMPANY
    CustomerPhase:
      type: string
      enum:
      - LEAD
      - CUSTOMER
    CustomerLifecycle:
      type: string
      enum:
      - ACTIVE
      - INACTIVE
      - ARCHIVED
    CreditRating:
      type: string
      enum:
      - LOW_RISK
      - MEDIUM_RISK
      - HIGH_RISK
    CustomerHistoryCategory:
      type: string
      enum:
      - work
      - finance
      - correspondence
      - tickets
      - operations
      - changes
    Industry:
      type: object
      additionalProperties: false
      properties:
        industry_id: *id002
        code:
          type: string
        title:
          type: string
        description:
          type:
          - string
          - 'null'
        is_active:
          type: boolean
        sort_order: *id002
      required:
      - industry_id
      - code
      - title
      - is_active
      - sort_order
    FunnelStep:
      type: object
      additionalProperties: false
      properties:
        sales_funnel_step_id: *id002
        code:
          type: string
        title:
          type: string
        sort_order: *id002
        outcome_type:
          $ref: '#/components/schemas/FunnelStepOutcome'
        is_active:
          type: boolean
      required:
      - sales_funnel_step_id
      - code
      - title
      - sort_order
      - outcome_type
      - is_active
    SalesFunnel:
      type: object
      additionalProperties: false
      properties:
        sales_funnel_id: *id002
        code:
          type: string
        title:
          type: string
        description:
          type:
          - string
          - 'null'
        catalog_item_id:
          type:
          - integer
          - 'null'
        is_active:
          type: boolean
        steps:
          type: array
          items:
            $ref: '#/components/schemas/FunnelStep'
      required:
      - sales_funnel_id
      - code
      - title
      - is_active
      - steps
    OpportunityCard:
      type: object
      additionalProperties: false
      properties:
        opportunity_id: *id002
        title:
          type: string
        customer_id: *id002
        customer:
          type: object
          additionalProperties: false
          properties:
            customer_id: *id002
            display_name:
              type: string
            phase:
              type: string
        assignee_id: *id002
        assignee:
          type: object
          additionalProperties: false
          properties:
            user_id: *id002
            display_name:
              type: string
        amount:
          type:
          - integer
          - 'null'
        probability:
          type:
          - string
          - 'null'
          description: Decimal string, 0-100.
        expected_close:
          type:
          - integer
          - 'null'
          description: Unix timestamp.
        next_task:
          type: object
          additionalProperties: false
          properties:
            task_id: *id002
            title:
              type: string
            status:
              $ref: '#/components/schemas/TaskStatus'
            due_at:
              type:
              - string
              - 'null'
              format: date-time
      required:
      - opportunity_id
      - title
      - customer_id
      - assignee_id
      - amount
      - probability
      - expected_close
    OpportunityBoard:
      type: object
      additionalProperties: false
      properties:
        funnel:
          $ref: '#/components/schemas/SalesFunnel'
        columns:
          type: array
          description: Every funnel step is a column, even when empty.
          items:
            type: object
            additionalProperties: false
            properties:
              step:
                $ref: '#/components/schemas/FunnelStep'
              items:
                type: array
                items:
                  $ref: '#/components/schemas/OpportunityCard'
            required:
            - step
            - items
      required:
      - funnel
      - columns
    Opportunity:

openapi: 3.1.0
info:
  title: Chabok CRM API
  version: 1.0.0
  description: CRM catalog, sales funnels and opportunities, sales documents, customer finance and tasks.
    Authored from the CRM handoff definition; enum values absent from that definition are typed as plain
    strings until confirmed. Tasks are served under /api/v1/tasks and customers under /api/v1/customers.
    All endpoints require a bearer token.
servers:
- url: /api/v1
security:
- bearerAuth: []
tags:
- name: CRM - Catalog
- name: CRM - Sales Funnels & Opportunities
- name: CRM - Sales Documents
- name: CRM - Finance
- name: CRM - Tasks
- name: CRM - Teams
- name: CRM - Customers
- name: CRM - Customer Addresses
- name: CRM - Customer Org Structure
- name: CRM - Customer History
paths:
  /crm/industries:
    get:
      tags:
      - CRM - Catalog
      operationId: listCrmIndustries
      summary: List industries
      x-chabok-permission: crm.industry.view
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
      - name: per_page
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: search
        in: query
        schema:
          type: string
          maxLength: 200
      - name: is_active
        in: query
        schema:
          type: boolean
      - &id001
        $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          $ref: '#/components/responses/IndustryList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /crm/sales-funnels:
    get:
      tags:
      - CRM - Sales Funnels & Opportunities
      operationId: listCrmSalesFunnels
      summary: List sales funnels (not paginated)
      x-chabok-permission: crm.opportunity.view
      parameters:
      - name: active
        in: query
        schema:
          type: boolean
      - *id001
      responses:
        '200':
          $ref: '#/components/responses/SalesFunnelList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /crm/opportunities:
    get:
      tags:
      - CRM - Sales Funnels & Opportunities
      operationId: getCrmOpportunityBoard
      summary: Opportunity kanban board
      x-chabok-permission: crm.opportunity.view
      parameters:
      - name: funnel_id
        in: query
        required: true
        schema: &id002
          type: integer
      - name: customer_id
        in: query
        schema: *id002
      - name: assignee_id
        in: query
        schema: *id002
      - *id001
      responses:
        '200':
          $ref: '#/components/responses/OpportunityBoard'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
    post:
      tags:
      - CRM - Sales Funnels & Opportunities
      operationId: createCrmOpportunity
      summary: Create an opportunity
      x-chabok-permission: crm.opportunity.manage
      parameters:
      - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOpportunityRequest'
      responses:
        '201':
          $ref: '#/components/responses/OpportunityWithEvent'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /crm/opportunities/{opportunityId}/step-transitions:
    post:
      tags:
      - CRM - Sales Funnels & Opportunities
      operationId: transitionCrmOpportunityStep
      summary: Move an opportunity to another funnel step
      x-chabok-permission: crm.opportunity.manage
      parameters:
      - $ref: '#/components/parameters/OpportunityId'
      - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepTransitionRequest'
      responses:
        '201':
          $ref: '#/components/responses/OpportunityWithEvent'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /crm/opportunities/{opportunityId}/events:
    get:
      tags:
      - CRM - Sales Funnels & Opportunities
      operationId: listCrmOpportunityEvents
      summary: List opportunity step events
      x-chabok-permission: crm.opportunity.view
      parameters:
      - $ref: '#/components/parameters/OpportunityId'
      - *id001
      responses:
        '200':
          $ref: '#/components/responses/OpportunityEventList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /crm/sales-documents:
    get:
      tags:
      - CRM - Sales Documents
      operationId: listCrmSalesDocuments
      summary: List sales documents
      x-chabok-permission: crm.sales_document.view
      parameters:
      - name: customer_id
        in: query
        schema: *id002
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/SalesDocumentStatus'
      - *id001
      responses:
        '200':
          $ref: '#/components/responses/SalesDocumentList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
    post:
      tags:
      - CRM - Sales Documents
      operationId: createCrmSalesDocument
      summary: Create a sales document with its first version
      x-chabok-permission: crm.sales_document.manage
      parameters:
      - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSalesDocumentRequest'
      responses:
        '201':
          $ref: '#/components/responses/SalesDocument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /crm/sales-documents/{documentId}:
    get:
      tags:
      - CRM - Sales Documents
      operationId: getCrmSalesDocument
      summary: Get a sales document
      x-chabok-permission: crm.sales_document.view
      parameters:
      - $ref: '#/components/parameters/DocumentId'
      - *id001
      responses:
        '200':
          $ref: '#/components/responses/SalesDocument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /crm/sales-documents/{documentId}/versions:
    post:
      tags:
      - CRM - Sales Documents
      operationId: createCrmSalesDocumentVersion
      summary: Create a new revision
      x-chabok-permission: crm.sales_document.manage
      parameters:
      - $ref: '#/components/parameters/DocumentId'
      - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSalesDocumentVersionRequest'
      responses:
        '201':
          $ref: '#/components/responses/SalesDocument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /crm/sales-document-versions/{versionId}/issue:
    post:
      tags:
      - CRM - Sales Documents
      operationId: issueCrmSalesDocumentVersion
      summary: Issue a sales document version
      x-chabok-permission: crm.sales_document.manage
      parameters:
      - $ref: '#/components/parameters/VersionId'
      - *id001
      responses:
        '200':
          $ref: '#/components/responses/SalesDocumentVersion'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /crm/sales-document-versions/{versionId}/accept:
    post:
      tags:
      - CRM - Sales Documents
      operationId: acceptCrmSalesDocumentVersion
      summary: Accept a sales document version
      x-chabok-permission: crm.sales_document.manage
      parameters:
      - $ref: '#/components/parameters/VersionId'
      - *id001
      responses:
        '200':
          $ref: '#/components/responses/SalesDocumentVersion'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /crm/sales-document-versions/{versionId}/cancel:
    post:
      tags:
      - CRM - Sales Documents
      operationId: cancelCrmSalesDocumentVersion
      summary: Cancel a sales document version
      x-chabok-permission: crm.sales_document.manage
      parameters:
      - $ref: '#/components/parameters/VersionId'
      - *id001
      responses:
        '200':
          $ref: '#/components/responses/SalesDocumentVersion'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /crm/customers/{customerId}/bank-accounts:
    get:
      tags:
      - CRM - Finance
      operationId: listCrmCustomerBankAccounts
      summary: List a customer's bank accounts
      x-chabok-permission: crm.finance.view
      parameters:
      - $ref: '#/components/parameters/CustomerId'
      - *id001
      responses:
        '200':
          $ref: '#/components/responses/BankAccountList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - CRM - Finance
      operationId: createCrmCustomerBankAccount
      summary: Add a bank account
      x-chabok-permission: crm.finance.manage
      parameters:
      - $ref: '#/components/parameters/CustomerId'
      - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBankAccountRequest'
      responses:
        '201':
          $ref: '#/components/responses/BankAccount'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /crm/customers/{customerId}/external-invoices:
    get:
      tags:
      - CRM - Finance
      operationId: listCrmCustomerExternalInvoices
      summary: List a customer's external invoices
      x-chabok-permission: crm.finance.view
      parameters:
      - $ref: '#/components/parameters/CustomerId'
      - *id001
      responses:
        '200':
          $ref: '#/components/responses/ExternalInvoiceList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - CRM - Finance
      operationId: createCrmCustomerExternalInvoice
      summary: Record an external invoice
      x-chabok-permission: crm.finance.manage
      parameters:
      - $ref: '#/components/parameters/CustomerId'
      - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExternalInvoiceRequest'
      responses:
        '201':
          $ref: '#/components/responses/ExternalInvoice'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /crm/customers/{customerId}/financial-entries:
    get:
      tags:
      - CRM - Finance
      operationId: listCrmCustomerFinancialEntries
      summary: List the whole ledger (not paginated)
      x-chabok-permission: crm.finance.view
      parameters:
      - $ref: '#/components/parameters/CustomerId'
      - name: kind
        in: query
        schema:
          $ref: '#/components/schemas/FinancialEntryKind'
      - *id001
      responses:
        '200':
          $ref: '#/components/responses/FinancialEntryList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
    post:
      tags:
      - CRM - Finance
      operationId: createCrmCustomerFinancialEntry
      summary: Post a financial entry
      x-chabok-permission: crm.finance.manage
      parameters:
      - $ref: '#/components/parameters/CustomerId'
      - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFinancialEntryRequest'
      responses:
        '201':
          $ref: '#/components/responses/FinancialEntry'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /crm/financial-entries/{entryId}/allocations:
    post:
      tags:
      - CRM - Finance
      operationId: allocateCrmFinancialEntry
      summary: Allocate a receipt to an invoice
      x-chabok-permission: crm.finance.manage
      parameters:
      - $ref: '#/components/parameters/EntryId'
      - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAllocationRequest'
      responses:
        '201':
          $ref: '#/components/responses/FinancialAllocation'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /tasks:
    get:
      tags:
      - CRM - Tasks
      operationId: listCrmTasks
      summary: List tasks
      x-chabok-permission: crm.task.view
      parameters:
      - name: scope
        in: query
        schema:
          $ref: '#/components/schemas/TaskScope'
      - name: bucket
        in: query
        schema:
          $ref: '#/components/schemas/TaskBucket'
      - name: q
        in: query
        schema:
          type: string
          maxLength: 200
      - *id001
      responses:
        '200':
          $ref: '#/components/responses/TaskList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
    post:
      tags:
      - CRM - Tasks
      operationId: createCrmTask
      summary: Create a task
      x-chabok-permission: crm.task.manage
      parameters:
      - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          $ref: '#/components/responses/TaskCreated'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /tasks/{taskId}/complete:
    post:
      tags:
      - CRM - Tasks
      operationId: completeCrmTask
      summary: Complete a task
      x-chabok-permission: crm.task.manage
      parameters:
      - $ref: '#/components/parameters/TaskId'
      - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteTaskRequest'
      responses:
        '200':
          $ref: '#/components/responses/Task'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /tasks/{taskId}/assignments:
    post:
      tags:
      - CRM - Tasks
      operationId: assignCrmTask
      summary: Refer, claim or reassign a task
      x-chabok-permission: crm.task.manage
      parameters:
      - $ref: '#/components/parameters/TaskId'
      - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignTaskRequest'
      responses:
        '201':
          $ref: '#/components/responses/TaskAssigned'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /tasks/{taskId}/actions:
    post:
      tags:
      - CRM - Tasks
      operationId: recordCrmTaskAction
      summary: Record an activity against a task
      x-chabok-permission: crm.task.manage
      parameters:
      - $ref: '#/components/parameters/TaskId'
      - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskActionRequest'
      responses:
        '201':
          $ref: '#/components/responses/TaskActionResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /crm/teams:
    get:
      tags:
      - CRM - Teams
      operationId: listCrmTeams
      summary: List teams (not paginated)
      x-chabok-permission: crm.team.view
      parameters:
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/TeamStatus'
      - *id001
      responses:
        '200':
          $ref: '#/components/responses/TeamList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
    post:
      tags:
      - CRM - Teams
      operationId: createCrmTeam
      summary: Create a team
      x-chabok-permission: crm.team.manage
      parameters:
      - &id003
        $ref: '#/components/parameters/IdempotencyKey'
      - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeamRequest'
      responses:
        '201':
          $ref: '#/components/responses/TeamCreated'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /crm/teams/{teamId}:
    patch:
      tags:
      - CRM - Teams
      operationId: updateCrmTeam
      summary: Update a team
      x-chabok-permission: crm.team.manage
      parameters:
      - $ref: '#/components/parameters/TeamId'
      - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTeamRequest'
      responses:
        '200':
          $ref: '#/components/responses/Team'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /crm/team-members:
    get:
      tags:
      - CRM - Teams
      operationId: listCrmTeamMembers
      summary: List team members
      x-chabok-permission: crm.team.view
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
      - name: per_page
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: team_id
        in: query
        schema: *id002
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/MembershipStatus'
      - name: q
        in: query
        schema:
          type: string
          maxLength: 200
      - *id001
      responses:
        '200':
          $ref: '#/components/responses/TeamMemberList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /crm/teams/{teamId}/members:
    post:
      tags:
      - CRM - Teams
      operationId: addCrmTeamMember
      summary: Add a member to a team
      x-chabok-permission: crm.team.manage
      parameters:
      - $ref: '#/components/parameters/TeamId'
      - *id003
      - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddTeamMemberRequest'
      responses:
        '201':
          $ref: '#/components/responses/TeamMember'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /crm/memberships/{membershipId}/end:
    post:
      tags:
      - CRM - Teams
      operationId: endCrmMembership
      summary: End a membership
      x-chabok-permission: crm.team.manage
      parameters:
      - $ref: '#/components/parameters/MembershipId'
      - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EndMembershipRequest'
      responses:
        '200':
          $ref: '#/components/responses/TeamMember'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /crm/memberships/bulk/preview:
    post:
      tags:
      - CRM - Teams
      operationId: previewCrmBulkMembership
      summary: Dry-run a bulk membership change

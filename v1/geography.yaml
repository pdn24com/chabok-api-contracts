openapi: 3.1.0
info:
  title: Chabok Geography Reference API
  version: 1.0.0
  description: Authenticated, read-only Iran province and city reference data.
servers:
  - url: /api/v1
tags:
  - name: Geography Reference
security:
  - bearerAuth: []
paths:
  /reference/provinces:
    get:
      tags: [Geography Reference]
      operationId: listReferenceProvinces
      summary: List Iran provinces
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Active'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated province reference data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvinceListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /reference/cities:
    get:
      tags: [Geography Reference]
      operationId: listReferenceCities
      summary: Search and list Iran cities
      parameters:
        - name: province_id
          in: query
          schema:
            type: string
            format: uuid
        - name: province_code
          in: query
          schema:
            type: string
            maxLength: 4
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Active'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated city reference data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /reference/cities/{city_id}:
    get:
      tags: [Geography Reference]
      operationId: getReferenceCity
      summary: Get one active city by canonical ID
      parameters:
        - name: city_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Active city reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Search:
      name: search
      in: query
      schema:
        type: string
        maxLength: 200
    Active:
      name: active
      in: query
      description: Defaults to true.
      schema:
        type: boolean
        default: true
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
  responses:
    Unauthenticated:
      description: Access token is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: The active reference record does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unprocessable:
      description: Query validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ProvinceSummary:
      type: object
      additionalProperties: false
      required: [province_id, legacy_province_code, name_fa]
      properties:
        province_id:
          type: string
          format: uuid
        legacy_province_code:
          type: string
        name_fa:
          type: string
    Province:
      allOf:
        - $ref: '#/components/schemas/ProvinceSummary'
        - type: object
          additionalProperties: false
          required: [latitude, longitude, is_active]
          properties:
            latitude:
              type: number
              minimum: -90
              maximum: 90
            longitude:
              type: number
              minimum: -180
              maximum: 180
            is_active:
              type: boolean
    City:
      type: object
      additionalProperties: false
      required: [city_id, legacy_city_code, name_fa, display_name, is_active, province]
      properties:
        city_id:
          type: string
          format: uuid
        legacy_city_code:
          type: string
        name_fa:
          type: string
        display_name:
          type: string
          description: Persian city, province, and legacy code for duplicate-safe selection.
        is_active:
          type: boolean
        province:
          $ref: '#/components/schemas/ProvinceSummary'
    Pagination:
      type: object
      additionalProperties: false
      required: [page, page_size, total, total_pages]
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }
    Meta:
      type: object
      additionalProperties: false
      required: [pagination]
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
    ProvinceListEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta, correlation_id]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Province'
        meta:
          $ref: '#/components/schemas/Meta'
        correlation_id:
          type: string
          format: uuid
    CityListEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta, correlation_id]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/City'
        meta:
          $ref: '#/components/schemas/Meta'
        correlation_id:
          type: string
          format: uuid
    CityEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta, correlation_id]
      properties:
        data:
          $ref: '#/components/schemas/City'
        meta:
          type: object
        correlation_id:
          type: string
          format: uuid
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error_code, message, field_errors, details, correlation_id]
      properties:
        error_code: { type: string }
        message: { type: string }
        field_errors: { type: object }
        details: { type: object }
        correlation_id:
          type: string
          format: uuid

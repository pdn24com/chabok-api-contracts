openapi: 3.1.0
info:
  title: Chabok Pricing API
  version: 1.0.0
  description: Versioned pricing configuration and deterministic IRR SALES quotes with immutable accepted snapshots.
servers: [{ url: /api/v1 }]
security: [{ bearerAuth: [] }]
tags: [{ name: Pricing Runtime }, { name: Pricing Administration }]
paths:
  /admin/pricing/service-tariffs/references:
    get:
      summary: List tenant-visible effective published service tariff families
      description: Requires pricing.tariff.view and Pricing entitlement. One current version per family, with its stable zone group.
      operationId: listServiceTariffReferences
      tags: [Pricing Administration]
      responses:
        '200': { description: Service family references., content: { application/json: { schema: { $ref: '#/components/schemas/GenericSuccess' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/pricing/matrix-workbooks/sample:
    post:
      summary: Download an RTL XLSX template for the selected matrix columns
      description: Requires pricing.tariff.manage_draft and Pricing entitlement. Returns base64 XLSX with example and instructions sheets. Amounts are IRR.
      operationId: createMatrixWorkbookSample
      tags: [Pricing Administration]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [zone_titles]
              properties:
                zone_titles: { type: array, minItems: 1, maxItems: 100, items: { type: string, minLength: 1, maxLength: 200 } }
      responses:
        '200': { description: Filename and content_base64 in the data envelope., content: { application/json: { schema: { $ref: '#/components/schemas/GenericSuccess' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /admin/pricing/matrix-workbooks/preview:
    post:
      summary: Parse an uploaded XLSX into replacement matrix preview without persistence
      description: Requires pricing.tariff.manage_draft and Pricing entitlement. Base64 transport supports files up to 5 MiB, 500 rows, 100 zones and 20 MiB expanded archive. Formulas, macros and external links are rejected. Columns follow template order. Preview must be explicitly applied and saved through the ordinary draft endpoint.
      operationId: previewMatrixWorkbook
      tags: [Pricing Administration]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content_base64, matrix]
              properties:
                content_base64: { type: string, maxLength: 6990508, contentEncoding: base64 }
                matrix: { $ref: '#/components/schemas/FreightMatrix' }
      responses:
        '200': { description: "Replacement matrix and band_count, linear_band_count, zone_count in the data envelope.", content: { application/json: { schema: { $ref: '#/components/schemas/GenericSuccess' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /admin/pricing/tariff-versions/{versionId}/simulate:
    post:
      summary: Test a saved draft with the shared calculator without creating an acceptable quote
      description: Requires pricing.tariff.manage_draft and pricing.quote.calculate, tenant visibility and active entitlements. Draft only; expected_version rejects stale input. Never creates a Quote, Snapshot or Consignment.
      tags: [Pricing Administration]
      operationId: simulatePricingDraft
      parameters: [{ $ref: '#/components/parameters/CorrelationId' }, { $ref: '#/components/parameters/VersionId' }]
      requestBody: { required: true, content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/QuoteRequest' }, { type: object, required: [expected_version], properties: { expected_version: { type: integer, minimum: 1 } } }] } } } }
      responses:
        '200': { description: Non-acceptable calculation from the saved draft., content: { application/json: { schema: { type: object, required: [data, meta, correlation_id], properties: { data: { $ref: '#/components/schemas/DraftSimulation' }, meta: { type: object }, correlation_id: { type: string, format: uuid } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /admin/pricing/audit:
    get:
      summary: List tenant-scoped Pricing audit events
      tags: [Pricing Administration]
      operationId: listPricingAuditEvents
      parameters: [{ $ref: '#/components/parameters/CorrelationId' }, { name: page, in: query, schema: { type: integer, minimum: 1 } }, { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }, { name: target_id, in: query, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Server-paginated audit events., content: { application/json: { schema: { $ref: '#/components/schemas/GenericSuccess' } } } }, '403': { $ref: '#/components/responses/Forbidden' } }
  /pricing/quotes:
    post:
      summary: Calculate a deterministic SALES quote
      tags: [Pricing Runtime]
      operationId: calculateSalesQuote
      parameters: [{ $ref: '#/components/parameters/CorrelationId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/QuoteRequest' } } } }
      responses:
        '201': { description: Deterministic offered Quote with explanation., content: { application/json: { schema: { $ref: '#/components/schemas/QuoteSuccess' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /pricing/quotes/{quoteId}:
    get:
      summary: Get an authorized pricing quote
      tags: [Pricing Runtime]
      operationId: getPricingQuote
      parameters: [{ $ref: '#/components/parameters/CorrelationId' }, { $ref: '#/components/parameters/QuoteId' }]
      responses:
        '200': { description: Authorized Quote detail., content: { application/json: { schema: { $ref: '#/components/schemas/QuoteSuccess' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /pricing/quotes/{quoteId}/reject:
    post:
      summary: Reject an offered pricing quote
      tags: [Pricing Runtime]
      operationId: rejectPricingQuote
      parameters: [{ $ref: '#/components/parameters/CorrelationId' }, { $ref: '#/components/parameters/QuoteId' }]
      responses:
        '200': { description: Quote rejected terminally., content: { application/json: { schema: { $ref: '#/components/schemas/QuoteSuccess' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /pricing/snapshots/accept:
    post:
      summary: Accept a quote as an immutable snapshot
      tags: [Pricing Runtime]
      operationId: acceptPricingQuote
      parameters: [{ $ref: '#/components/parameters/CorrelationId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [quote_id, object_type, object_id, input_fingerprint], properties: { quote_id: { type: string, format: uuid }, object_type: { type: string }, object_id: { type: string, format: uuid }, input_fingerprint: { type: string, minLength: 64, maxLength: 64 } } } } } }
      responses:
        '201': { description: Immutable accepted Pricing Snapshot., content: { application/json: { schema: { $ref: '#/components/schemas/GenericSuccess' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /admin/pricing/tariff-families:
    get:
      summary: List tariff families
      tags: [Pricing Administration]
      operationId: listTariffFamilies
      parameters: [{ $ref: '#/components/parameters/CorrelationId' }, { name: page, in: query, schema: { type: integer, minimum: 1 } }, { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }, { name: search, in: query, schema: { type: string } }]
      responses: { '200': { description: Server-paginated tariff families., content: { application/json: { schema: { $ref: '#/components/schemas/GenericSuccess' } } } }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      summary: Create a tariff family and initial draft
      tags: [Pricing Administration]
      operationId: createTariffFamilyAndDraft
      parameters: [{ $ref: '#/components/parameters/CorrelationId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TariffFamilyCreate' } } } }
      responses: { '201': { description: Tariff family and initial draft., content: { application/json: { schema: { $ref: '#/components/schemas/GenericSuccess' } } } }, '403': { $ref: '#/components/responses/Forbidden' }, '422': { $ref: '#/components/responses/Unprocessable' } }
  /admin/pricing/charge-types:
    get:
      summary: List stable Charge Types
      tags: [Pricing Administration]
      operationId: listPricingChargeTypes
      parameters: [{ $ref: '#/components/parameters/CorrelationId' }]
      responses: { '200': { description: Stable Charge Types., content: { application/json: { schema: { $ref: '#/components/schemas/GenericSuccess' } } } }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      summary: Create a stable Charge Type
      tags: [Pricing Administration]
      operationId: createChargeType
      parameters: [{ $ref: '#/components/parameters/CorrelationId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [code, category, accounting_mapping_key], additionalProperties: true } } } }
      responses: { '201': { description: Stable Charge Type., content: { application/json: { schema: { $ref: '#/components/schemas/GenericSuccess' } } } }, '403': { $ref: '#/components/responses/Forbidden' } }
  /admin/pricing/zone-sets:
    get:
      summary: List Pricing Zone Sets
      tags: [Pricing Administration]
      operationId: listPricingZoneSets
      parameters: [{ $ref: '#/components/parameters/CorrelationId' }, { name: page, in: query, schema: { type: integer, minimum: 1 } }, { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }, { name: search, in: query, schema: { type: string } }]
      responses: { '200': { description: Server-paginated Zone Sets., content: { application/json: { schema: { $ref: '#/components/schemas/GenericSuccess' } } } }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      summary: Create a Zone Set and initial draft
      tags: [Pricing Administration]
      operationId: createPricingZoneSet
      parameters: [{ $ref: '#/components/parameters/CorrelationId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ZoneSetDraft' } } } }
      responses: { '201': { description: Zone Set and initial draft version., content: { application/json: { schema: { $ref: '#/components/schemas/GenericSuccess' } } } }, '403': { $ref: '#/components/responses/Forbidden' } }
  /admin/pricing/zone-set-versions/references:
    get:
      summary: Search tenant-visible Pricing Zone Set versions for authoritative selectors
      tags: [Pricing Administration]
      operationId: listPricingZoneSetVersionReferences
      parameters:
        - { $ref: '#/components/parameters/CorrelationId' }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: search, in: query, schema: { type: string, maxLength: 120 } }
        - { name: include_version_id, in: query, description: Includes the currently saved version even when it is no longer published., schema: { type: string, format: uuid } }
      responses:
        '200': { description: Bounded tenant-visible version references with their zones., content: { application/json: { schema: { $ref: '#/components/schemas/ZoneSetVersionReferencePage' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/pricing/zone-set-versions/{versionId}:
    patch:
      summary: Update a Zone Set draft with optimistic concurrency
      tags: [Pricing Administration]
      operationId: updatePricingZoneSetDraft
      parameters: [{ $ref: '#/components/parameters/CorrelationId' }, { $ref: '#/components/parameters/VersionId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ZoneSetDraft' } } } }
      responses: { '200': { description: Optimistically updated Zone Set draft., content: { application/json: { schema: { $ref: '#/components/schemas/GenericSuccess' } } } }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/Unprocessable' } }
  /admin/pricing/zone-set-versions/{versionId}/validate:
    post:
      summary: Validate a Pricing Zone Set draft
      tags: [Pricing Administration]
      operationId: validatePricingZoneSetDraft
      parameters: [{ $ref: '#/components/parameters/CorrelationId' }, { $ref: '#/components/parameters/VersionId' }]
      responses: { '200': { description: Stable Zone Set validation results., content: { application/json: { schema: { $ref: '#/components/schemas/GenericSuccess' } } } }, '403': { $ref: '#/components/responses/Forbidden' } }
  /admin/pricing/tariff-versions/{versionId}:
    patch:
      summary: Update a Tariff draft with optimistic concurrency
      tags: [Pricing Administration]
      operationId: updateTariffDraft
      parameters: [{ $ref: '#/components/parameters/CorrelationId' }, { $ref: '#/components/parameters/VersionId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TariffDraft' } } } }
      responses: { '200': { description: Optimistically updated Tariff draft., content: { application/json: { schema: { $ref: '#/components/schemas/GenericSuccess' } } } }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/Unprocessable' } }
  /admin/pricing/tariff-versions/{versionId}/validate:
    post:
      summary: Validate a Tariff draft
      tags: [Pricing Administration]
      operationId: validateTariffDraft
      parameters: [{ $ref: '#/components/parameters/CorrelationId' }, { $ref: '#/components/parameters/VersionId' }]
      responses: { '200': { description: Stable tariff validation results., content: { application/json: { schema: { $ref: '#/components/schemas/GenericSuccess' } } } }, '403': { $ref: '#/components/responses/Forbidden' } }
  /admin/pricing/{kind}/identities/{identityId}/versions:
    get:
      summary: List immutable Pricing version history
      tags: [Pricing Administration]
      operationId: listPricingVersionHistory
      parameters: [{ $ref: '#/components/parameters/CorrelationId' }, { name: kind, in: path, required: true, schema: { type: string, enum: [tariffs, zone-sets] } }, { $ref: '#/components/parameters/IdentityId' }]
      responses: { '200': { description: Version history with predecessor links. Tariff entries also contain configured_zone_set and effective_zone_set (nullable) resolved by the runtime successor resolver at zone_resolution_at. zone_resolution_error denotes unavailable or ambiguous effective zones. This view does not modify historical quotes., content: { application/json: { schema: { $ref: '#/components/schemas/GenericSuccess' } } } }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      summary: Clone a Pricing successor draft
      tags: [Pricing Administration]
      operationId: clonePricingSuccessorDraft
      parameters: [{ $ref: '#/components/parameters/CorrelationId' }, { name: kind, in: path, required: true, schema: { type: string, enum: [tariffs, zone-sets] } }, { $ref: '#/components/parameters/IdentityId' }]
      responses: { '201': { description: Successor draft cloned from latest immutable version., content: { application/json: { schema: { $ref: '#/components/schemas/GenericSuccess' } } } }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' } }
  /admin/pricing/{kind}/{versionId}/{action}:
    post:
      summary: Transition a Pricing version
      tags: [Pricing Administration]
      operationId: transitionPricingVersion
      parameters: [{ $ref: '#/components/parameters/CorrelationId' }, { name: kind, in: path, required: true, schema: { type: string, enum: [tariffs, zone-sets] } }, { $ref: '#/components/parameters/VersionId' }, { name: action, in: path, required: true, schema: { type: string, enum: [approve, publish, supersede, archive] } }]
      responses: { '200': { description: Permission-gated lifecycle transition. An authorized approver may also publish the version., content: { application/json: { schema: { $ref: '#/components/schemas/GenericSuccess' } } } }, '403': { $ref: '#/components/responses/Forbidden' }, '422': { $ref: '#/components/responses/Unprocessable' } }
components:
  securitySchemes: { bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT } }
  parameters:
    CorrelationId: { name: X-Correlation-ID, in: header, schema: { type: string, format: uuid } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 120 } }
    QuoteId: { name: quoteId, in: path, required: true, schema: { type: string, format: uuid } }
    VersionId: { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
    IdentityId: { name: identityId, in: path, required: true, schema: { type: string, format: uuid } }
  schemas:
    PricingLifecycleStatus:
      type: string
      enum: [DRAFT, READY_FOR_APPROVAL, APPROVED, PUBLISHED, SUPERSEDED, ARCHIVED]
    PricingZoneReference:
      type: object
      additionalProperties: false
      required: [pricing_zone_id, code, title, remote_area]
      properties:
        pricing_zone_id: { type: string, format: uuid }
        code: { type: string }
        title: { type: string }
        rank: { type: [integer, 'null'], minimum: 1, description: Explicit rank unique within this Zone Set version; never inferred. }
        remote_area: { type: boolean }
    ZoneSetVersionReference:
      type: object
      additionalProperties: false
      required: [zone_set_version_id, pricing_zone_set_id, code, title, purpose, version_number, status, zones]
      properties:
        zone_set_version_id: { type: string, format: uuid }
        pricing_zone_set_id: { type: string, format: uuid }
        code: { type: string }
        title: { type: string }
        purpose: { type: string }
        version_number: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/PricingLifecycleStatus' }
        valid_from: { type: [string, 'null'], format: date-time }
        valid_to: { type: [string, 'null'], format: date-time }
        zones: { type: array, items: { $ref: '#/components/schemas/PricingZoneReference' } }
    ZoneSetVersionReferencePage:
      type: object
      additionalProperties: false
      required: [data, meta, correlation_id]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ZoneSetVersionReference' } }
        meta: { type: object, additionalProperties: true }
        correlation_id: { type: string, format: uuid }
    QuoteRequest:
      type: object
      required: [service_offering_id, sender, receiver, declared_value_amount, insurance_enabled, cod_enabled]
      properties:
        purpose: { type: string, enum: [SALES, PURCHASE, COMMISSION, INTERNAL_TRANSFER], default: SALES }
        channel: { type: string, default: BRANCH }
        as_of_timestamp: { type: [string, 'null'], format: date-time }
        service_offering_id: { type: string, format: uuid }
        service_offering_version_id: { type: [string, 'null'], format: uuid }
        selected_option_version_ids: { type: array, items: { type: string, format: uuid } }
        pickup_service_date: { type: [string, 'null'], format: date }
        pickup_window_code: { type: [string, 'null'], maxLength: 80 }
        delivery_window_code: { type: [string, 'null'], maxLength: 80 }
        sender: { $ref: '#/components/schemas/GeographyPartyInput' }
        receiver: { $ref: '#/components/schemas/GeographyPartyInput' }
        parcels: { type: array, items: { type: object, additionalProperties: true } }
        weight_kg: { type: [number, 'null'], exclusiveMinimum: 0 }
        declared_value_amount: { type: integer, minimum: 0 }
        insurance_enabled: { type: boolean, enum: [true], description: Declared-value insurance is mandatory. }
        cod_enabled: { type: boolean }
        cod_amount: { type: [integer, 'null'], minimum: 0 }
    Quote: { type: object, additionalProperties: true }
    GeographyPartyInput:
      type: object
      additionalProperties: false
      required: [city_id]
      properties:
        city_id: { type: string, format: uuid }
        postal_code: { type: [string, 'null'], maxLength: 32 }
        latitude: { type: [number, 'null'], minimum: -90, maximum: 90, description: Actual address position; required together with longitude when the selected effective Zone Set contains polygons. Never use a city centroid. }
        longitude: { type: [number, 'null'], minimum: -180, maximum: 180 }
        zone_override: { type: [string, 'null'], maxLength: 200 }
    ZoneMember:
      type: object
      additionalProperties: false
      description: CITY membership identity is city_id; province_id is optional request context validated against the City and is always returned from cities.province_id. PROVINCE membership identity is province_id and city_id is null.
      required: [member_type]
      properties:
        member_type: { type: string, enum: [EXPLICIT_OVERRIDE, POSTAL_RANGE, CITY, PROVINCE, POLYGON] }
        geometry: { anyOf: [{ $ref: '#/components/schemas/ZonePolygon' }, { type: 'null' }] }
        reference_value: { type: [string, 'null'], maxLength: 200 }
        city_id: { type: [string, 'null'], format: uuid, description: Required membership identity for CITY; null for PROVINCE. }
        province_id: { type: [string, 'null'], format: uuid, description: "Required membership identity for PROVINCE. Optional UI grouping context in CITY requests; when supplied it must match the selected City's canonical Province, and CITY responses always return the canonical value derived from cities.province_id." }
        range_end: { type: [string, 'null'], maxLength: 200, description: POSTAL_RANGE endpoints must be ordered ten-digit strings for new or changed members. Persian/Arabic digits normalize to ASCII. Unchanged legacy ranges may be retained in their existing zone and cloned; they are never padded or truncated. }
        precedence: { type: integer, readOnly: true, enum: [100, 200, 250, 300, 400] }
    ZonePolygon:
      type: object
      additionalProperties: false
      required: [type, coordinates]
      description: GeoJSON WGS84 longitude/latitude Polygon or MultiPolygon, interpreted in the coordinate plane consistently with Coverage. Closed valid rings and valid topology required. Boundaries included. Any intersection between polygons in different zones of one version is rejected before saving. Postal (300) outranks polygon (250), then city (200). Missing actual address coordinates yields 422 PRICING_ZONE_UNRESOLVED with reason_code PRICING_COORDINATES_REQUIRED. Overlaps yield 422 PRICING_ZONE_AMBIGUOUS with reason_code PRICING_POLYGON_OVERLAP. Invalid topology yields 422 VALIDATION_ERROR.
      properties:
        type: { type: string, enum: [Polygon, MultiPolygon] }
        coordinates:
          oneOf:
            - { type: array, minItems: 1, items: { type: array, minItems: 4, items: { type: array, minItems: 2, maxItems: 2, items: { type: number } } } }
            - { type: array, minItems: 1, items: { type: array, minItems: 1, items: { type: array, minItems: 4, items: { type: array, minItems: 2, maxItems: 2, items: { type: number } } } } }
    ZoneDraft:
      type: object
      additionalProperties: false
      required: [code, title, members]
      properties:
        pricing_zone_id: { type: string, format: uuid, description: Existing identity within this draft version; foreign identifiers are never adopted. }
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]{0,79}$', description: Editable region code. New regions default to A through Z then AA onward. }
        title: { type: string }
        rank: { type: [integer, 'null'], minimum: 1, description: Explicit rank unique within this Zone Set version; never inferred. }
        remote_area: { type: boolean }
        members: { type: array, minItems: 1, items: { $ref: '#/components/schemas/ZoneMember' } }
    ZoneSetDraft:
      type: object
      additionalProperties: false
      required: [zones]
      properties:
        expected_version: { type: integer, minimum: 1 }
        code: { type: string, pattern: '^(?:[0-9]{6}|[A-Z][A-Z0-9_]{1,79})$', description: Required on creation. The editor proposes a six-digit numeric code; legacy technical codes remain accepted. }
        purpose: { type: string, enum: [SALES, PURCHASE, COMMISSION, INTERNAL_TRANSFER] }
        title: { type: string }
        valid_from: { type: [string, 'null'], format: date-time }
        valid_to: { type: [string, 'null'], format: date-time }
        zones: { type: array, minItems: 1, items: { $ref: '#/components/schemas/ZoneDraft' } }
    TariffFamilyCreate:
      allOf:
        - $ref: '#/components/schemas/TariffDraft'
        - type: object
          required: [title, purpose, currency]
          properties:
            code: { type: [string, 'null'], pattern: '^[0-9]{1,9}$', description: Optional numeric code. Omit to generate a unique nine-digit code. Historical codes are unchanged. }
            title: { type: string, minLength: 1, maxLength: 200, description: Human-readable Persian family name. Stored on the family and returned in lists and version details; historical families may have a null title. }
    TariffDraft:
      type: object
      required: [zone_set_version_id, rules]
      properties:
        tariff_kind: { type: string, enum: [FREIGHT, SERVICE], default: FREIGHT }
        service_charge_type_id: { type: [string, 'null'], format: uuid }
        matrix_basis: { type: string, enum: [ACTUAL_WEIGHT, BILLABLE_WEIGHT, PARCEL_COUNT, DECLARED_VALUE, COD_AMOUNT] }
        is_default: { type: boolean, default: false }
        service_tariff_family_ids: { type: array, maxItems: 30, uniqueItems: true, items: { type: string, format: uuid }, description: Stable service families resolved to their latest effective published version on each new quote. }
        expected_version: { type: integer, minimum: 1 }
        code: { type: string }
        purpose: { type: string, enum: [SALES, PURCHASE, COMMISSION, INTERNAL_TRANSFER] }
        currency: { type: string, enum: [IRR] }
        scope_type: { type: string, enum: [PLATFORM, TENANT, SEGMENT, CUSTOMER, CONTRACT] }
        scope_value: { type: [string, 'null'], description: Server-derived for PLATFORM and TENANT; an authoritative reference for other scope types. }
        priority: { type: integer, minimum: 1, maximum: 65535 }
        zone_set_version_id: { type: [string, 'null'], format: uuid, description: Required for freight. Null means a global service matrix. }
        valid_from: { type: [string, 'null'], format: date-time }
        valid_to: { type: [string, 'null'], format: date-time }
        volumetric_divisor: { type: number, exclusiveMinimum: 0 }
        weight_rounding_step_kg: { type: number, exclusiveMinimum: 0 }
        rounding_mode: { type: string, enum: [HALF_UP, HALF_EVEN, CEILING, FLOOR, STEP_UP] }
        zone_policy: { $ref: '#/components/schemas/ZonePolicy' }
        freight_matrices: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/FreightMatrix' }, description: Version-owned editing document. Compiled base rules are generated server-side. Blanks and gaps block publication within the declared domain. }
        rules: { type: array, maxItems: 10000, items: { $ref: '#/components/schemas/TariffRateRule' } }
    ZonePolicy:
      type: string
      enum: [DIRECTIONAL, HIGHER_ZONE_RANK]
      default: DIRECTIONAL
      description: Higher rank affects base freight only. Ranks must be complete, positive and unique in the resolved Zone Set version. No historical conversion.
    FreightCell:
      type: object
      additionalProperties: false
      required: [id, zone_id, state, amount]
      properties:
        id: { type: string, format: uuid }
        zone_id: { type: string, format: uuid }
        state: { type: string, enum: [EMPTY, RATE, UNCOVERED] }
        amount: { type: [integer, 'null'], minimum: 0, maximum: 9007199254740991, description: RATE requires a positive integer under the current base-freight policy. EMPTY and UNCOVERED require null. }
    FreightBand:
      type: object
      additionalProperties: false
      required: [id, from, to, cells]
      properties:
        id: { type: string, format: uuid }
        from: { type: number, minimum: 0, multipleOf: 0.0001, description: Inclusive lower bound. }
        to: { type: number, exclusiveMinimum: 0, multipleOf: 0.0001, description: Exclusive upper bound; must exceed lower bound. }
        cells: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/FreightCell' } }
    FreightLinearTail:
      type: object
      additionalProperties: false
      required: [id, from, step_kg, cells]
      properties:
        id: { type: string, format: uuid }
        from: { type: number, minimum: 0, multipleOf: 0.0001, description: Must equal the final nonlinear upper bound. Its rate is the base amount at this exact threshold. }
        step_kg: { type: number, exclusiveMinimum: 0, maximum: 99999999, multipleOf: 0.0001 }
        cells: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/FreightCell' }, description: RATE amount is the IRR increment per started step; final amount is the last band base plus ceil((billable weight - from) / step_kg) times this increment. No upper bound. }
    FreightLinearBand:
      type: object
      additionalProperties: false
      required: [id, from, to, step_kg, cells]
      properties:
        id: { type: string, format: uuid }
        from: { type: number, minimum: 0, multipleOf: 0.0001, description: Must meet the previous band end. Base is the previous band endpoint amount. }
        to: { type: [number, 'null'], exclusiveMinimum: 0, multipleOf: 0.0001, description: Exclusive upper bound; null means unbounded and is allowed only on the last band. }
        step_kg: { type: number, exclusiveMinimum: 0, maximum: 99999999, multipleOf: 0.0001 }
        cells: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/FreightCell' }, description: Per-zone increase for each started step above from. }
    FreightMatrix:
      type: object
      additionalProperties: false
      required: [id, service_offering_version_id, service_option_version_id, origin_zone_id, zone_ids, bands]
      properties:
        id: { type: string, format: uuid }
        service_offering_version_id: { type: [string, 'null'], format: uuid }
        service_option_version_id: { type: [string, 'null'], format: uuid }
        origin_zone_id: { type: [string, 'null'], format: uuid, description: Required for DIRECTIONAL; null for HIGHER_ZONE_RANK. }
        zone_ids: { type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: { type: string, format: uuid }, description: Explicit declared domain of columns. }
        bands: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/FreightBand' } }
        linear_bands: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/FreightLinearBand' }, description: Ordered contiguous linear bands after nonlinear bands. Cannot coexist with a non-null legacy linear_tail. }
        linear_tail: { oneOf: [{ $ref: '#/components/schemas/FreightLinearTail' }, { type: 'null' }] }
    DraftSimulation:
      type: object
      required: [mode, acceptable, tariff_version_id, lock_version, zone_set_version_id, currency, calculated_at, lines, total_amount, subtotal_amount, discount_amount, tax_amount, resolution_evidence, warnings]
      properties:
        mode: { type: string, const: DRAFT }
        acceptable: { type: boolean, const: false }
        tariff_version_id: { type: string, format: uuid }
        lock_version: { type: integer }
        zone_set_version_id: { type: string, format: uuid }
        currency: { type: string, const: IRR }
        calculated_at: { type: string, format: date-time }
        lines: { type: array, items: { type: object, additionalProperties: true } }
        total_amount: { type: integer }
        subtotal_amount: { type: integer }
        discount_amount: { type: integer }
        tax_amount: { type: integer }
        resolution_evidence: { type: object, additionalProperties: true }
        warnings: { type: array, items: { type: string } }
    TariffRateRule:
      type: object
      additionalProperties: false
      required: [service_offering_version_id, charge_type_id, calculation_method]
      properties:
        taxable: { type: [boolean, 'null'], description: Null inherits the Charge Type; false excludes this line from tax bases. }
        incremental_step: { type: [number, 'null'], readOnly: true, exclusiveMinimum: 0, description: Server-compiled service SLAB step in matrix basis units. }
        incremental_step_kg: { type: [number, 'null'], readOnly: true, exclusiveMinimum: 0, description: Server-compiled incremental SLAB weight step; omitted for historical rules. }
        matrix_cell_id: { type: [string, 'null'], format: uuid }
        service_offering_version_id: { type: [string, 'null'], format: uuid, description: Required for directly authored freight rules; null for server-compiled service matrix rules. }
        service_option_version_id: { type: [string, 'null'], format: uuid, description: Exact immutable option target; null applies to the Offering generally. }
        charge_type_id: { type: string, format: uuid }
        origin_zone_id: { type: [string, 'null'], format: uuid }
        destination_zone_id: { type: [string, 'null'], format: uuid }
        calculation_method: { type: string, enum: [FIXED, PER_UNIT, SLAB, TIERED, PERCENT, MIN_MAX] }
        basis: { type: string, enum: [FLAT, SHIPMENT, ACTUAL_WEIGHT, BILLABLE_WEIGHT, PARCEL_COUNT, DECLARED_VALUE, COD_AMOUNT] }
        range_from: { type: [number, 'null'], minimum: 0 }
        range_to: { type: [number, 'null'], minimum: 0 }
        fixed_amount: { type: [integer, 'null'], minimum: 0 }
        unit_rate: { type: [number, 'null'], minimum: 0 }
        percentage_bps: { type: [integer, 'null'], minimum: 0, maximum: 10000 }
        minimum_amount: { type: [integer, 'null'], minimum: 0 }
        maximum_amount: { type: [integer, 'null'], minimum: 0 }
        amount_rounding_mode: { type: string, enum: [NONE, CEIL, FLOOR, HALF_UP], default: NONE }
        amount_rounding_step: { type: [integer, 'null'], minimum: 1, description: Independent IRR money step; not the weight-rounding step. }
        basis_charge_codes: { type: array, items: { type: string } }
        conditions: { type: object, additionalProperties: true }
        priority: { type: integer, minimum: 1, maximum: 65535 }
    QuoteSuccess: { type: object, required: [data, meta, correlation_id], properties: { data: { $ref: '#/components/schemas/Quote' }, meta: { type: object }, correlation_id: { type: string, format: uuid } } }
    GenericSuccess: { type: object, required: [data, meta, correlation_id], properties: { data: {}, meta: { type: object }, correlation_id: { type: string, format: uuid } } }
    ErrorEnvelope: { type: object, required: [error_code, message, field_errors, details, correlation_id], properties: { error_code: { type: string }, message: { type: string }, field_errors: { type: object }, details: { type: object }, correlation_id: { type: string, format: uuid } } }
  responses:
    Forbidden: { description: "Tenant, entitlement, permission, or scope denied.", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    Conflict: { description: "Identifier, idempotency, or concurrency conflict.", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    Unprocessable: { description: "Validation, lifecycle, expiry, tampering, or domain-policy rejection.", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }

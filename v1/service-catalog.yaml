openapi: 3.1.0
info:
  title: Chabok Service Catalog API
  version: 1.0.0
  description: Direct catalog editing with stable identities and automatically retained immutable technical revisions. Only Pricing zones and tariffs have a user-managed publication lifecycle.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Service Catalog Runtime
  - name: Service Catalog Administration
paths:
  /admin/service-catalog/commitment-zone-groups:
    get:
      operationId: commitmentZoneGroups
      summary: Tenant-scoped current zone groups selectable in commitment schedules
      responses:
        '200':
          description: Requires ServiceCatalog entitlement and service_catalog.view. Only currently effective published groups are returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { type: object, properties: { pricing_zone_set_id: { type: string, format: uuid }, zone_set_version_id: { type: string, format: uuid }, code: { type: string }, title: { type: string }, zones: { type: array, items: { type: object, properties: { code: { type: string }, title: { type: string } } } } } } }
                  meta: { type: object }
                  correlation_id: { type: string, format: uuid }
  /admin/service-catalog/records/{resource}:
    parameters: [{ name: resource, in: path, required: true, schema: { type: string, enum: [service-types, shipping-methods, offerings, options, commitment-schedules] } }]
    post:
      operationId: createCatalogRecord
      summary: Create immediately effective catalog configuration
      description: Requires ServiceCatalog entitlement and service_catalog.view, service_catalog.manage_draft AND service_catalog.publish. Server validation, audit and outbox are atomic. Legacy draft-only access does not authorize this operation.
      parameters: [{ name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 128 } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CatalogRecordInput' } } } }
      responses:
        '201': { description: Stored current record and fresh lock_version., content: { application/json: { schema: { $ref: '#/components/schemas/CatalogRecordSuccess' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Stale lock_version or reused Idempotency-Key with a different request. }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /admin/service-catalog/records/{resource}/{identityId}:
    parameters: [{ name: resource, in: path, required: true, schema: { type: string, enum: [service-types, shipping-methods, offerings, options, commitment-schedules] } }, { name: identityId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      operationId: getCatalogRecord
      summary: Read current editable configuration by stable identity
      responses:
        '200': { description: Stored current record and fresh lock_version., content: { application/json: { schema: { $ref: '#/components/schemas/CatalogRecordSuccess' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Record not found in the current tenant. }
    put:
      operationId: saveCatalogRecord
      summary: Save current configuration without manual version management
      description: Same permissions as create. Requires expected_version from lock_version. An exact repeated save succeeds without a new revision. Published historical contents and foreign keys are retained. Changes invalidate unissued quotes; request a new quote on CATALOG_CHANGED. An inactive record remains inactive after saving.
      parameters: [{ name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 128 } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CatalogRecordInput' } } } }
      responses:
        '200': { description: Stored current record and fresh lock_version., content: { application/json: { schema: { $ref: '#/components/schemas/CatalogRecordSuccess' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Stale lock_version or reused Idempotency-Key with a different request. }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /admin/service-catalog/records/{resource}/{identityId}/status:
    parameters: [{ name: resource, in: path, required: true, schema: { type: string, enum: [service-types, shipping-methods, offerings, options, commitment-schedules] } }, { name: identityId, in: path, required: true, schema: { type: string, format: uuid } }]
    patch:
      operationId: setCatalogRecordActive
      summary: Activate or deactivate a current catalog record
      description: Requires the same effective-edit grants as save. Historical usage remains readable. Repeating the current state succeeds without mutation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active, expected_version]
              properties: { active: { type: boolean }, expected_version: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Stored current record and fresh lock_version., content: { application/json: { schema: { $ref: '#/components/schemas/CatalogRecordSuccess' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Stale lock_version or reused Idempotency-Key with a different request. }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /services/resolve:
    post:
      summary: Resolve eligible published service offerings
      tags: [Service Catalog Runtime]
      operationId: resolveEligibleServiceOfferings
      parameters: [{ $ref: '#/components/parameters/CorrelationId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EligibilityContext' } } } }
      responses:
        '200': { description: Eligible and conditional published offerings., content: { application/json: { schema: { $ref: '#/components/schemas/OfferingListSuccess' } } } }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /services/{offeringId}/validate:
    post:
      summary: Validate a selected service offering
      tags: [Service Catalog Runtime]
      operationId: validateSelectedServiceOffering
      parameters: [{ $ref: '#/components/parameters/CorrelationId' }, { $ref: '#/components/parameters/OfferingId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EligibilityContext' } } } }
      responses:
        '200': { description: Deterministic eligibility decision and evidence., content: { application/json: { schema: { $ref: '#/components/schemas/OfferingSuccess' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /services/{offeringId}/commitments:
    post:
      summary: Preview the service commitment
      tags: [Service Catalog Runtime]
      operationId: previewServiceCommitment
      parameters: [{ $ref: '#/components/parameters/CorrelationId' }, { $ref: '#/components/parameters/OfferingId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EligibilityContext' } } } }
      responses:
        '200': { description: SLA commitment preview., content: { application/json: { schema: { $ref: '#/components/schemas/GenericSuccess' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /services/pickup-windows:
    get:
      summary: Resolve currently bookable Pickup windows for the active HQ and node
      tags: [Service Catalog Runtime]
      operationId: listBookablePickupWindows
      parameters: [{ $ref: '#/components/parameters/CorrelationId' }, { $ref: '#/components/parameters/NodeId' }, { name: at, in: query, schema: { type: string, format: date-time } }]
      responses:
        '200': { description: Server-authoritative Pickup windows including cut-off and UTC boundaries., content: { application/json: { schema: { $ref: '#/components/schemas/PickupWindowListSuccess' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /admin/service-catalog/commitment-schedules:
    get:
      summary: List tenant-scoped commitment schedule identities
      tags: [Service Catalog Administration]
      operationId: listCommitmentSchedules
      parameters: [{ $ref: '#/components/parameters/CorrelationId' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }, { name: search, in: query, schema: { type: string } }]
      responses:
        '200': { description: Paginated schedule identities., content: { application/json: { schema: { $ref: '#/components/schemas/GenericSuccess' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create a schedule identity and initial draft version
      tags: [Service Catalog Administration]
      operationId: createCommitmentSchedule
      parameters: [{ $ref: '#/components/parameters/CorrelationId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CommitmentScheduleDraft' } } } }
      responses:
        '201': { description: Schedule draft created., content: { application/json: { schema: { $ref: '#/components/schemas/CommitmentScheduleSuccess' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /admin/service-catalog/commitment-schedules/published-versions:
    get:
      summary: List tenant-visible published commitment schedule versions
      tags: [Service Catalog Administration]
      operationId: listPublishedCommitmentSchedules
      parameters: [{ $ref: '#/components/parameters/CorrelationId' }, { name: 'include_version_ids[]', in: query, description: Tenant-visible currently saved versions to retain in edit selectors even when no longer published., schema: { type: array, maxItems: 100, items: { type: string, format: uuid } } }]
      responses:
        '200': { description: Published schedule versions for Offering binding., content: { application/json: { schema: { $ref: '#/components/schemas/CommitmentScheduleListSuccess' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/service-catalog/commitment-schedules/identities/{identityId}/versions:
    get:
      summary: List immutable schedule version history
      tags: [Service Catalog Administration]
      operationId: listCommitmentScheduleHistory
      parameters: [{ $ref: '#/components/parameters/CorrelationId' }, { $ref: '#/components/parameters/IdentityId' }]
      responses:
        '200': { description: Schedule version lineage., content: { application/json: { schema: { $ref: '#/components/schemas/CommitmentScheduleListSuccess' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Clone a successor schedule draft
      tags: [Service Catalog Administration]
      operationId: cloneCommitmentScheduleDraft
      parameters: [{ $ref: '#/components/parameters/CorrelationId' }, { $ref: '#/components/parameters/IdentityId' }]
      responses:
        '201': { description: Successor schedule draft cloned., content: { application/json: { schema: { $ref: '#/components/schemas/CommitmentScheduleSuccess' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/service-catalog/commitment-schedules/versions/{versionId}:
    patch:
      summary: Update a schedule draft using optimistic concurrency
      tags: [Service Catalog Administration]
      operationId: updateCommitmentScheduleDraft
      parameters: [{ $ref: '#/components/parameters/CorrelationId' }, { $ref: '#/components/parameters/VersionId' }]
      requestBody: { required: true, content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/CommitmentScheduleDraft' }, { type: object, required: [expected_version], properties: { expected_version: { type: integer, minimum: 1 } } }] } } } }
      responses:
        '200': { description: Schedule draft updated., content: { application/json: { schema: { $ref: '#/components/schemas/CommitmentScheduleSuccess' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /admin/service-catalog/commitment-schedules/versions/{versionId}/validate:
    post:
      summary: Validate a schedule draft
      tags: [Service Catalog Administration]
      operationId: validateCommitmentScheduleDraft
      parameters: [{ $ref: '#/components/parameters/CorrelationId' }, { $ref: '#/components/parameters/VersionId' }]
      responses:
        '200': { description: Stable validation errors., content: { application/json: { schema: { $ref: '#/components/schemas/GenericSuccess' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/service-catalog/commitment-schedules/versions/{versionId}/{action}:
    post:
      summary: Transition a commitment schedule version
      tags: [Service Catalog Administration]
      operationId: transitionCommitmentScheduleVersion
      parameters: [{ $ref: '#/components/parameters/CorrelationId' }, { $ref: '#/components/parameters/VersionId' }, { name: action, in: path, required: true, schema: { type: string, enum: [approve, publish, supersede, archive] } }]
      responses:
        '200': { description: 'Schedule transitioned with tenant, permission, lifecycle, audit, and outbox enforcement.', content: { application/json: { schema: { $ref: '#/components/schemas/CommitmentScheduleSuccess' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /admin/service-catalog/{resource}:
    get:
      summary: List stable service catalog identities
      tags: [Service Catalog Administration]
      operationId: listServiceCatalogIdentities
      parameters: [{ $ref: '#/components/parameters/CorrelationId' }, { $ref: '#/components/parameters/Resource' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }, { name: search, in: query, schema: { type: string } }]
      responses:
        '200': { description: Server-paginated identities with localized labels from the latest version., content: { application/json: { schema: { $ref: '#/components/schemas/CatalogIdentityListSuccess' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create an identity and initial draft
      tags: [Service Catalog Administration]
      operationId: createServiceCatalogIdentity
      parameters: [{ $ref: '#/components/parameters/CorrelationId' }, { $ref: '#/components/parameters/Resource' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CatalogDraft' } } } }
      responses:
        '201': { description: Identity and initial draft created., content: { application/json: { schema: { $ref: '#/components/schemas/OfferingSuccess' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /admin/service-catalog/{resource}/published-versions:
    get:
      summary: List tenant-visible published versions for administration selectors
      tags: [Service Catalog Administration]
      operationId: listPublishedServiceCatalogVersions
      parameters: [{ $ref: '#/components/parameters/CorrelationId' }, { $ref: '#/components/parameters/Resource' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }, { name: search, in: query, schema: { type: string } }, { name: 'include_version_ids[]', in: query, description: Tenant-visible currently saved versions to retain in edit selectors even when no longer published., schema: { type: array, maxItems: 100, items: { type: string, format: uuid } } }]
      responses:
        '200': { description: 'Published versions with stable code, localized labels, version number, and exact version identifier.', content: { application/json: { schema: { $ref: '#/components/schemas/PublishedVersionListSuccess' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/service-catalog/audit:
    get:
      summary: List tenant-scoped Service Catalog audit events
      tags: [Service Catalog Administration]
      operationId: listServiceCatalogAuditEvents
      parameters: [{ $ref: '#/components/parameters/CorrelationId' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }, { name: target_id, in: query, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Server-paginated audit events., content: { application/json: { schema: { $ref: '#/components/schemas/GenericSuccess' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/service-catalog/{resource}/identities/{identityId}/versions:
    get:
      summary: List immutable version history
      tags: [Service Catalog Administration]
      operationId: listServiceCatalogVersionHistory
      parameters: [{ $ref: '#/components/parameters/CorrelationId' }, { $ref: '#/components/parameters/Resource' }, { $ref: '#/components/parameters/IdentityId' }]
      responses:
        '200': { description: Immutable version lineage., content: { application/json: { schema: { $ref: '#/components/schemas/OfferingListSuccess' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Clone a successor draft
      tags: [Service Catalog Administration]
      operationId: cloneServiceCatalogSuccessorDraft
      parameters: [{ $ref: '#/components/parameters/CorrelationId' }, { $ref: '#/components/parameters/Resource' }, { $ref: '#/components/parameters/IdentityId' }]
      responses:
        '201': { description: Successor draft cloned from latest version., content: { application/json: { schema: { $ref: '#/components/schemas/OfferingSuccess' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/service-catalog/{resource}/versions/{versionId}:
    patch:
      summary: Update a draft with optimistic concurrency
      tags: [Service Catalog Administration]
      operationId: updateServiceCatalogDraft
      parameters: [{ $ref: '#/components/parameters/CorrelationId' }, { $ref: '#/components/parameters/Resource' }, { $ref: '#/components/parameters/VersionId' }]
      requestBody: { required: true, content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/CatalogDraft' }, { type: object, required: [expected_version], properties: { expected_version: { type: integer, minimum: 1 } } }] } } } }
      responses:
        '200': { description: Optimistically updated draft., content: { application/json: { schema: { $ref: '#/components/schemas/OfferingSuccess' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /admin/service-catalog/{resource}/versions/{versionId}/validate:
    post:
      summary: Validate a service catalog draft
      tags: [Service Catalog Administration]
      operationId: validateServiceCatalogDraft
      parameters: [{ $ref: '#/components/parameters/CorrelationId' }, { $ref: '#/components/parameters/Resource' }, { $ref: '#/components/parameters/VersionId' }]
      responses:
        '200': { description: Stable validation codes and fields., content: { application/json: { schema: { $ref: '#/components/schemas/GenericSuccess' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/service-catalog/{resource}/versions/{versionId}/{action}:
    post:
      summary: Transition a service catalog version
      tags: [Service Catalog Administration]
      operationId: transitionServiceCatalogVersion
      parameters: [{ $ref: '#/components/parameters/CorrelationId' }, { $ref: '#/components/parameters/Resource' }, { $ref: '#/components/parameters/VersionId' }, { name: action, in: path, required: true, schema: { type: string, enum: [approve, publish, supersede, archive] } }]
      responses:
        '200': { description: 'Version transitioned with permission, lifecycle, and audit enforcement. An authorized approver may publish the same version.', content: { application/json: { schema: { $ref: '#/components/schemas/OfferingSuccess' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    CorrelationId: { name: X-Correlation-ID, in: header, schema: { type: string, format: uuid } }
    NodeId: { name: X-Node-Id, in: header, required: true, schema: { type: string, format: uuid } }
    OfferingId: { name: offeringId, in: path, required: true, schema: { type: string, format: uuid } }
    IdentityId: { name: identityId, in: path, required: true, schema: { type: string, format: uuid } }
    VersionId: { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
    Resource: { name: resource, in: path, required: true, schema: { type: string, enum: [service-types, shipping-methods, offerings, options] } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
  schemas:
    EligibilityContext:
      type: object
      required: [channel, sender, receiver]
      properties:
        service_offering_version_id: { type: [string, 'null'], format: uuid }
        channel: { type: string, enum: [BRANCH, VENDOR, DRIVER, HQ, API, TRACKING, LEGACY] }
        as_of_timestamp: { type: [string, 'null'], format: date-time }
        acceptance_at: { type: [string, 'null'], format: date-time }
        pickup_window_code: { type: [string, 'null'] }
        pickup_service_date: { type: [string, 'null'], format: date }
        delivery_window_code: { type: [string, 'null'] }
        sender: { type: object, additionalProperties: true }
        receiver: { type: object, additionalProperties: true }
        parcels: { type: array, items: { type: object, additionalProperties: true } }
        selected_option_version_ids: { type: array, items: { type: string, format: uuid } }
    CatalogRecordInput:
      type: object
      description: CatalogDraft fields for the four catalog resources, or CommitmentScheduleDraft fields for schedules. Offerings use stable service_type_id, shipping_method_id, option_rules[].service_option_id and commitment_binding.commitment_schedule_id. Technical version IDs are not writable through this endpoint. Expected version is required on update only. Code is optional on create and immutable afterwards. Validity timestamps are ignored on current-record writes; new technical revisions persist null bounds and activation alone controls new catalog selection. Historical timestamps remain read-only evidence.
      properties:
        code: { type: [string, 'null'], pattern: '^[0-9]{6}$' }
        expected_version: { type: integer, minimum: 1 }
        labels: { type: object, additionalProperties: { type: string } }
        title: { type: string }
        description: { type: [string, 'null'] }
        definition: { type: object, additionalProperties: true }
        service_type_id: { type: string, format: uuid }
        shipping_method_id: { type: string, format: uuid }
        option_rules: { type: array, items: { type: object, required: [service_option_id, compatibility], properties: { service_option_id: { type: string, format: uuid }, compatibility: { type: string, enum: [ALLOWED, REQUIRED, FORBIDDEN, CONDITIONAL] }, condition: { type: [object, 'null'], additionalProperties: true } } } }
        commitment_binding: { type: [object, 'null'], properties: { commitment_schedule_id: { type: string, format: uuid }, pickup_mode: { type: string, enum: [NONE, SELECTABLE_WINDOW, COMPUTED] }, delivery_mode: { type: string, enum: [NONE, SELECTABLE_WINDOW, COMPUTED] }, duration_value: { type: [integer, 'null'], minimum: 1 }, duration_unit: { type: [string, 'null'] }, duration_anchor: { type: [string, 'null'] } } }
        availability_bindings: { type: array, items: { $ref: '#/components/schemas/AvailabilityBinding' } }
        eligibility_rules: { type: array, items: { type: object, additionalProperties: true } }
        coverage_references: { type: array, items: { $ref: '#/components/schemas/CoverageReference' } }
        sla_policy: { type: object, additionalProperties: true }
        availability_summary: { type: object, additionalProperties: true }
        timezone: { type: string }
        commitment_policy: { $ref: '#/components/schemas/ScheduleCommitmentPolicy' }
        calendar_code: { type: string }
        windows: { type: array, items: { $ref: '#/components/schemas/CommitmentScheduleWindow' } }
        scopes: { type: array, minItems: 1, items: { type: object, properties: { scope_type: { type: string, enum: [HQ, NODE] }, node_id: { type: [string, 'null'], format: uuid } } } }
    CatalogRecord:
      type: object
      required: [code, status, lock_version]
      additionalProperties: true
      properties:
        code: { type: string }
        status: { type: string, enum: [ACTIVE, INACTIVE, ARCHIVED] }
        lock_version: { type: integer, minimum: 1 }
        service_type_id: { type: string, format: uuid }
        shipping_method_id: { type: string, format: uuid }
        service_offering_id: { type: string, format: uuid }
        service_option_id: { type: string, format: uuid }
        commitment_schedule_id: { type: string, format: uuid }
    CatalogRecordSuccess:
      type: object
      required: [data, meta, correlation_id]
      properties: { data: { $ref: '#/components/schemas/CatalogRecord' }, meta: { type: object }, correlation_id: { type: string, format: uuid } }
    CatalogDraft:
      type: object
      required: [labels]
      properties:
        code: { type: [string, 'null'], pattern: '^(?:[0-9]{6}|[A-Z][A-Z0-9_]{1,79})$', description: 'Optional on create; a unique six-digit numeric code is generated when omitted. Existing integration codes remain supported.' }
        labels: { type: object, additionalProperties: { type: string } }
        description: { type: [string, 'null'] }
        definition: { type: object, additionalProperties: true }
        service_type_version_id: { type: string, format: uuid }
        shipping_method_version_id: { type: string, format: uuid }
        sla_policy: { type: object, additionalProperties: true, description: Legacy SLA policy. May be empty or omitted when commitment_binding is supplied; the binding is authoritative. }
        option_rules: { type: array, items: { type: object, additionalProperties: true } }
        eligibility_rules: { type: array, items: { type: object, additionalProperties: true } }
        coverage_references: { type: array, items: { $ref: '#/components/schemas/CoverageReference' } }
        availability_bindings: { type: array, items: { $ref: '#/components/schemas/AvailabilityBinding' } }
        commitment_binding: { oneOf: [{ $ref: '#/components/schemas/OfferingCommitmentBinding' }, { type: 'null' }] }
        valid_from:
          type: [string, 'null']
          format: date-time
          description: Null means the version has no lower validity bound.
        valid_to:
          type: [string, 'null']
          format: date-time
          description: Null means the version has no upper validity bound. When both bounds are null, the version is indefinitely valid.
    OfferingCommitmentBinding:
      type: object
      required: [commitment_schedule_version_id, pickup_mode, delivery_mode]
      properties:
        commitment_schedule_version_id: { type: string, format: uuid }
        pickup_mode: { type: string, enum: [NONE, SELECTABLE_WINDOW, COMPUTED] }
        delivery_mode: { type: string, enum: [NONE, SELECTABLE_WINDOW, COMPUTED] }
        duration_value: { type: [integer, 'null'], minimum: 1 }
        duration_unit: { type: [string, 'null'], enum: [MINUTE, HOUR, DAY, null] }
        duration_anchor: { type: [string, 'null'], enum: [CONSIGNMENT_CREATED, PICKUP_COMMITMENT_START, PICKUP_COMMITMENT_END, PICKUP_COMPLETED, null] }
    AvailabilityBinding:
      type: object
      additionalProperties: false
      required: [scope_type]
      properties:
        scope_type: { type: string, enum: [PLATFORM, TENANT, CUSTOMER_SEGMENT, CUSTOMER, CONTRACT, CHANNEL] }
        scope_value: { type: [string, 'null'], description: Server-derived for PLATFORM and TENANT. CHANNEL uses the published channel enum; reference-backed scopes require an authoritative directory. }
        enabled: { type: boolean, default: true }
    CoverageReference:
      type: object
      additionalProperties: false
      required: [direction, reference_type, reference_value]
      properties:
        direction: { type: string, enum: [ORIGIN, DESTINATION, LANE, BOTH] }
        reference_type: { type: string, enum: [COUNTRY, PROVINCE, CITY, POSTAL_RANGE, OPERATIONAL_AREA, PRICING_ZONE_SET] }
        reference_value: { type: string, maxLength: 200, description: 'IR for COUNTRY; authoritative entity/version ID for PROVINCE, CITY, OPERATIONAL_AREA, and PRICING_ZONE_SET; range start for POSTAL_RANGE.' }
        secondary_reference_value: { type: [string, 'null'], maxLength: 200, description: 'Range end for POSTAL_RANGE only; null for every other reference type.' }
        priority: { type: integer, minimum: 1, maximum: 65535, default: 100 }
    CommitmentTemporalPolicy:
      type: object
      required: [mode, anchor, calculation, duration_value, duration_unit, day_offset, window_codes]
      properties:
        risk_threshold_minutes: { type: integer, minimum: 0, maximum: 525600, default: 120, description: 'Warning threshold before deadline, frozen at consignment issuance.' }
        mode: { type: string, enum: [NONE, SELECTABLE_WINDOW, COMPUTED] }
        anchor: { type: string, enum: [CONSIGNMENT_CREATED, PICKUP_COMPLETED, PICKUP_COMMITMENT_START, PICKUP_COMMITMENT_END] }
        calculation: { type: string, enum: [ELAPSED, DAY_END, BUSINESS_DAY_END] }
        duration_value: { type: integer, minimum: 1, maximum: 8760 }
        duration_unit: { type: string, enum: [MINUTE, HOUR, DAY] }
        day_offset: { type: integer, minimum: 0, maximum: 365, description: 'Zero means the anchor day; business-day-end skips holidays.' }
        window_codes: { type: array, uniqueItems: true, items: { type: string }, description: 'Empty selects all active pickup windows. Delivery policies must explicitly select at least one active window. Historical empty delivery selections remain readable.' }
    ScheduleCommitmentPolicy:
      type: object
      description: 'Schedule-owned policy. Legacy absent policy preserves offering binding semantics. Holiday exclusion and BUSINESS_DAY_END return SLA_CALENDAR_UNAVAILABLE until the owner-deferred calendar source is configured. Timezone is supplied by system configuration.'
      required: [include_holidays, pickup, delivery, destination_rules]
      properties:
        include_holidays: { type: boolean }
        pickup: { $ref: '#/components/schemas/CommitmentTemporalPolicy' }
        delivery:
          description: 'Default for destinations without a specific rule. May be null only when all current group zones have specific rules. Missing coverage fails save with 422. A later uncovered destination is ineligible with DELIVERY_COMMITMENT_UNCONFIGURED.'
          anyOf: [{ $ref: '#/components/schemas/CommitmentTemporalPolicy' }, { type: 'null' }]
        zone_set_id: { type: [string, 'null'], format: uuid, description: 'Stable group identity; latest effective published zone version is resolved for new uses.' }
        destination_rules:
          type: array
          maxItems: 200
          items:
            type: object
            required: [id, destination_zone_code, policy]
            properties:
              id: { type: string, format: uuid }
              destination_zone_code: { type: string, maxLength: 80, description: 'Unique within the schedule; saved against current group codes.' }
              origin_zone_code: { type: 'null', description: 'Reserved for a future origin-destination extension.' }
              policy: { $ref: '#/components/schemas/CommitmentTemporalPolicy' }
    CommitmentScheduleWindow:
      type: object
      required: [window_code, window_type, label_fa, start_time, end_time, booking_cutoff_time, applicable_weekdays]
      properties:
        risk_threshold_minutes: { type: integer, minimum: 0, maximum: 525600, default: 120 }
        window_code: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,79}$' }
        window_type: { type: string, enum: [PICKUP, DELIVERY] }
        label_fa: { type: string }
        start_time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9])?$', description: 'Wall-clock HH:mm or HH:mm:ss. Existing seconds are preserved; the editor displays hours and minutes.' }
        end_time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9])?$', description: 'Wall-clock HH:mm or HH:mm:ss. Existing seconds are preserved; the editor displays hours and minutes.' }
        booking_cutoff_time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9])?$', description: 'Wall-clock HH:mm or HH:mm:ss. Existing seconds are preserved; the editor displays hours and minutes.' }
        applicable_weekdays: { type: array, minItems: 1, items: { type: integer, minimum: 1, maximum: 7 } }
        day_offset: { type: integer, minimum: 0, maximum: 30, default: 0 }
        active: { type: boolean, default: true }
    CommitmentScheduleDraft:
      type: object
      required: [windows, scopes]
      properties:
        code: { type: [string, 'null'], pattern: '^(?:[0-9]{6}|[A-Z][A-Z0-9_]{1,79})$', description: 'Optional on create; a unique six-digit numeric code is generated when omitted. Existing integration codes remain supported.' }
        title: { type: string }
        timezone: { type: string, example: Asia/Tehran }
        commitment_policy: { $ref: '#/components/schemas/ScheduleCommitmentPolicy' }
        calendar_code: { type: string, example: IR_STANDARD }
        valid_from: { type: [string, 'null'], format: date-time }
        valid_to: { type: [string, 'null'], format: date-time }
        windows: { type: array, items: { $ref: '#/components/schemas/CommitmentScheduleWindow' } }
        scopes:
          type: array
          minItems: 1
          items:
            type: object
            required: [scope_type]
            properties:
              scope_type: { type: string, enum: [HQ, NODE] }
              node_id: { type: [string, 'null'], format: uuid }
    CommitmentScheduleVersion: { type: object, additionalProperties: true }
    CommitmentScheduleSuccess:
      type: object
      required: [data, meta, correlation_id]
      properties: { data: { $ref: '#/components/schemas/CommitmentScheduleVersion' }, meta: { type: object }, correlation_id: { type: string, format: uuid } }
    CommitmentScheduleListSuccess:
      type: object
      required: [data, meta, correlation_id]
      properties: { data: { type: array, items: { $ref: '#/components/schemas/CommitmentScheduleVersion' } }, meta: { type: object }, correlation_id: { type: string, format: uuid } }
    PickupWindow:
      type: object
      required: [commitment_schedule_version_id, window_code, window_type, label_fa, service_date, starts_at, ends_at, booking_cutoff_at, timezone]
      properties:
        commitment_schedule_version_id: { type: string, format: uuid }
        window_code: { type: string }
        window_type: { type: string, enum: [PICKUP] }
        label_fa: { type: string }
        service_date: { type: string, format: date }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        booking_cutoff_at: { type: string, format: date-time }
        timezone: { type: string }
    PickupWindowListSuccess:
      type: object
      required: [data, meta, correlation_id]
      properties: { data: { type: array, items: { $ref: '#/components/schemas/PickupWindow' } }, meta: { type: object }, correlation_id: { type: string, format: uuid } }
    CatalogIdentity:
      type: object
      required: [code, labels, latest_status, latest_version_number, latest_version_id]
      properties:
        code: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }
          description: Localized labels from the latest version of this identity.
        latest_status: { type: [string, 'null'] }
        latest_version_number: { type: [integer, 'null'], minimum: 1 }
        latest_version_id: { type: [string, 'null'], format: uuid }
      additionalProperties: true
    CatalogIdentityListSuccess:
      type: object
      required: [data, meta, correlation_id]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/CatalogIdentity' } }
        meta: { type: object }
        correlation_id: { type: string, format: uuid }
    OfferingVersion: { type: object, additionalProperties: true }
    OfferingSuccess:
      type: object
      required: [data, meta, correlation_id]
      properties: { data: { $ref: '#/components/schemas/OfferingVersion' }, meta: { type: object }, correlation_id: { type: string, format: uuid } }
    OfferingListSuccess:
      type: object
      required: [data, meta, correlation_id]
      properties: { data: { type: array, items: { $ref: '#/components/schemas/OfferingVersion' } }, meta: { type: object }, correlation_id: { type: string, format: uuid } }
    PublishedVersion:
      type: object
      required: [code, labels, version_number, status]
      properties:
        code: { type: string }
        labels: { type: object, additionalProperties: { type: string } }
        version_number: { type: integer, minimum: 1 }
        status: { type: string, enum: [DRAFT, VALIDATING, READY_FOR_APPROVAL, APPROVED, PUBLISHED, SUPERSEDED, ARCHIVED, CANCELLED] }
        service_type_version_id: { type: string, format: uuid }
        shipping_method_version_id: { type: string, format: uuid }
        service_offering_version_id: { type: string, format: uuid }
        service_option_version_id: { type: string, format: uuid }
        valid_from: { type: [string, 'null'], format: date-time }
        valid_to: { type: [string, 'null'], format: date-time }
      additionalProperties: true
    PublishedVersionListSuccess:
      type: object
      required: [data, meta, correlation_id]
      properties: { data: { type: array, items: { $ref: '#/components/schemas/PublishedVersion' } }, meta: { type: object }, correlation_id: { type: string, format: uuid } }
    GenericSuccess: { type: object, required: [data, meta, correlation_id], properties: { data: {}, meta: { type: object }, correlation_id: { type: string, format: uuid } } }
    ErrorEnvelope: { type: object, required: [error_code, message, field_errors, details, correlation_id], properties: { error_code: { type: string }, message: { type: string }, field_errors: { type: object }, details: { type: object }, correlation_id: { type: string, format: uuid } } }
  responses:
    AuthenticationRequired: { description: Authentication required., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    Forbidden: { description: "Tenant, entitlement, permission, or scope denied.", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    Conflict: { description: Identifier or optimistic-concurrency conflict., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    Unprocessable: { description: "Validation, lifecycle, or domain-policy rejection.", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }

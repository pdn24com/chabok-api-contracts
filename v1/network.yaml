      requestBody: { $ref: '#/components/requestBodies/LifecycleCommand' }
      responses: { '200': { $ref: '#/components/responses/RouteVersionDetail' }, '401': { $ref: '#/components/responses/Unauthenticated' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/Unprocessable' } }

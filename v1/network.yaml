      x-chabok-entitlement: LiveOperations
      x-chabok-permission: network.coverage.validate
      parameters: [{ $ref: '#/components/parameters/PolicyId' }, { $ref: '#/components/parameters/VersionId' }, { $ref: '#/components/parameters/CorrelationId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/LifecycleCommand' }
      responses: { '200': { $ref: '#/components/responses/CoverageVersionDetail' }, '401': { $ref: '#/components/responses/Unauthenticated' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/Unprocessable' } }
  /network/coverage-policies/{policy_id}/versions/{version_id}/approve:
    post:
      tags: [Coverage Policies]
      operationId: approveCoveragePolicyVersion
      summary: Approve a validated Coverage Policy Version
      x-chabok-entitlement: LiveOperations
      x-chabok-permission: network.coverage.approve
      parameters: [{ $ref: '#/components/parameters/PolicyId' }, { $ref: '#/components/parameters/VersionId' }, { $ref: '#/components/parameters/CorrelationId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/LifecycleCommand' }
      responses: { '200': { $ref: '#/components/responses/CoverageVersionDetail' }, '401': { $ref: '#/components/responses/Unauthenticated' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/Unprocessable' } }
  /network/coverage-policies/{policy_id}/versions/{version_id}/publish:
    post:
      tags: [Coverage Policies]
      operationId: publishCoveragePolicyVersion
      summary: Publish an approved Coverage Policy Version
      x-chabok-entitlement: LiveOperations
      x-chabok-permission: network.coverage.publish
      parameters: [{ $ref: '#/components/parameters/PolicyId' }, { $ref: '#/components/parameters/VersionId' }, { $ref: '#/components/parameters/CorrelationId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/LifecycleCommand' }
      responses: { '200': { $ref: '#/components/responses/CoverageVersionDetail' }, '401': { $ref: '#/components/responses/Unauthenticated' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/Unprocessable' } }
  /network/coverage-policies/{policy_id}/versions/{version_id}/supersede:
    post:
      tags: [Coverage Policies]
      operationId: supersedeCoveragePolicyVersion
      summary: Supersede a published Coverage Policy Version
      x-chabok-entitlement: LiveOperations
      x-chabok-permission: network.coverage.publish
      parameters: [{ $ref: '#/components/parameters/PolicyId' }, { $ref: '#/components/parameters/VersionId' }, { $ref: '#/components/parameters/CorrelationId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/LifecycleCommand' }
      responses: { '200': { $ref: '#/components/responses/CoverageVersionDetail' }, '401': { $ref: '#/components/responses/Unauthenticated' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/Unprocessable' } }

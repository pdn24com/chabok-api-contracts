    patch:
      tags: [Route Definitions]
      operationId: updateNetworkRouteDefinitionVersion
      summary: Replace editable Route Definition Version content
      x-chabok-entitlement: LiveOperations
      x-chabok-permission: network.route.manage_draft
      parameters: [{ $ref: '#/components/parameters/RouteDefinitionId' }, { $ref: '#/components/parameters/VersionId' }, { $ref: '#/components/parameters/CorrelationId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateRouteVersionRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/RouteVersionDetail' }, '401': { $ref: '#/components/responses/Unauthenticated' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/Unprocessable' } }
  /network/route-definitions/{route_definition_id}/versions/{version_id}/validate:
    post:
      tags: [Route Definitions]
      operationId: validateNetworkRouteDefinitionVersion
      summary: Validate a draft Route Definition Version
      x-chabok-entitlement: LiveOperations
      x-chabok-permission: network.route.validate
      parameters: [{ $ref: '#/components/parameters/RouteDefinitionId' }, { $ref: '#/components/parameters/VersionId' }, { $ref: '#/components/parameters/CorrelationId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/LifecycleCommand' }
      responses: { '200': { $ref: '#/components/responses/RouteVersionDetail' }, '401': { $ref: '#/components/responses/Unauthenticated' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/Unprocessable' } }

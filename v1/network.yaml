openapi: 3.1.0
info:
  title: Chabok Network Administration API
  version: 1.0.0
  description: >-
    Current-HQ Area, Node, geographic Coverage Policy, and ordered Route
    Definition administration. This is the Wave 1 public contract baseline;
    operations are not implemented by the foundation commit.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Network Areas
  - name: Network Nodes
  - name: Coverage Policies
  - name: Route Definitions
paths:
  /network/areas:
    get:
      tags: [Network Areas]
      operationId: listNetworkAreas
      summary: List current-HQ Areas
      x-chabok-entitlement: LiveOperations
      x-chabok-permission: network.area.view
      parameters: [{ $ref: '#/components/parameters/Search' }, { $ref: '#/components/parameters/Status' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PerPage' }, { $ref: '#/components/parameters/CorrelationId' }]
      responses: { '200': { $ref: '#/components/responses/AreaList' }, '401': { $ref: '#/components/responses/Unauthenticated' }, '403': { $ref: '#/components/responses/Forbidden' }, '422': { $ref: '#/components/responses/Unprocessable' } }
    post:
      tags: [Network Areas]
      operationId: createNetworkArea
      summary: Create an Area
      x-chabok-entitlement: LiveOperations
      x-chabok-permission: network.area.manage
      parameters: [{ $ref: '#/components/parameters/CorrelationId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateAreaRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/AreaDetail' }, '401': { $ref: '#/components/responses/Unauthenticated' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/Unprocessable' } }
  /network/areas/{area_id}:
    get:
      tags: [Network Areas]
      operationId: getNetworkArea
      summary: Get an Area
      x-chabok-entitlement: LiveOperations
      x-chabok-permission: network.area.view
      parameters: [{ $ref: '#/components/parameters/AreaId' }, { $ref: '#/components/parameters/CorrelationId' }]
      responses: { '200': { $ref: '#/components/responses/AreaDetail' }, '401': { $ref: '#/components/responses/Unauthenticated' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    patch:
      tags: [Network Areas]
      operationId: updateNetworkArea
      summary: Update an Area with optimistic concurrency
      x-chabok-entitlement: LiveOperations
      x-chabok-permission: network.area.manage
      parameters: [{ $ref: '#/components/parameters/AreaId' }, { $ref: '#/components/parameters/CorrelationId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateAreaRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/AreaDetail' }, '401': { $ref: '#/components/responses/Unauthenticated' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/Unprocessable' } }
  /network/nodes:
    get:
      tags: [Network Nodes]
      operationId: listNetworkNodes
      summary: List current-HQ Nodes
      x-chabok-entitlement: LiveOperations
      x-chabok-permission: network.node.view
      parameters: [{ $ref: '#/components/parameters/Search' }, { $ref: '#/components/parameters/Status' }, { name: area_id, in: query, schema: { type: string, format: uuid } }, { name: node_type, in: query, schema: { $ref: '#/components/schemas/NodeType' } }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PerPage' }, { $ref: '#/components/parameters/CorrelationId' }]
      responses: { '200': { $ref: '#/components/responses/NodeList' }, '401': { $ref: '#/components/responses/Unauthenticated' }, '403': { $ref: '#/components/responses/Forbidden' }, '422': { $ref: '#/components/responses/Unprocessable' } }
    post:
      tags: [Network Nodes]
      operationId: createNetworkNode
      summary: Create a Node
      x-chabok-entitlement: LiveOperations
      x-chabok-permission: network.node.manage
      parameters: [{ $ref: '#/components/parameters/CorrelationId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateNodeRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/NodeDetail' }, '401': { $ref: '#/components/responses/Unauthenticated' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/Unprocessable' } }
  /network/nodes/{node_id}:
    get:
      tags: [Network Nodes]
      operationId: getNetworkNode
      summary: Get a Node
      x-chabok-entitlement: LiveOperations
      x-chabok-permission: network.node.view
      parameters: [{ $ref: '#/components/parameters/NodeId' }, { $ref: '#/components/parameters/CorrelationId' }]
      responses: { '200': { $ref: '#/components/responses/NodeDetail' }, '401': { $ref: '#/components/responses/Unauthenticated' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    patch:
      tags: [Network Nodes]
      operationId: updateNetworkNode
      summary: Update a Node with optimistic concurrency
      x-chabok-entitlement: LiveOperations
      x-chabok-permission: network.node.manage
      parameters: [{ $ref: '#/components/parameters/NodeId' }, { $ref: '#/components/parameters/CorrelationId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateNodeRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/NodeDetail' }, '401': { $ref: '#/components/responses/Unauthenticated' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/Unprocessable' } }
  /network/coverage-policies:
    get:
      tags: [Coverage Policies]
      operationId: listCoveragePolicies
      summary: List Coverage Policy identities
      x-chabok-entitlement: LiveOperations
      x-chabok-permission: network.coverage.view
      parameters: [{ $ref: '#/components/parameters/Search' }, { name: target, in: query, schema: { $ref: '#/components/schemas/CoverageTarget' } }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PerPage' }, { $ref: '#/components/parameters/CorrelationId' }]
      responses: { '200': { $ref: '#/components/responses/CoveragePolicyList' }, '401': { $ref: '#/components/responses/Unauthenticated' }, '403': { $ref: '#/components/responses/Forbidden' }, '422': { $ref: '#/components/responses/Unprocessable' } }
    post:
      tags: [Coverage Policies]
      operationId: createCoveragePolicy
      summary: Create a Coverage Policy identity
      x-chabok-entitlement: LiveOperations
      x-chabok-permission: network.coverage.manage_draft
      parameters: [{ $ref: '#/components/parameters/CorrelationId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateCoveragePolicyRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/CoveragePolicyDetail' }, '401': { $ref: '#/components/responses/Unauthenticated' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/Unprocessable' } }
  /network/coverage-policies/{policy_id}:
    get:
      tags: [Coverage Policies]
      operationId: getCoveragePolicy
      summary: Get a Coverage Policy identity
      x-chabok-entitlement: LiveOperations
      x-chabok-permission: network.coverage.view
      parameters: [{ $ref: '#/components/parameters/PolicyId' }, { $ref: '#/components/parameters/CorrelationId' }]
      responses: { '200': { $ref: '#/components/responses/CoveragePolicyDetail' }, '401': { $ref: '#/components/responses/Unauthenticated' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /network/coverage-policies/{policy_id}/versions:
    get:
      tags: [Coverage Policies]
      operationId: listCoveragePolicyVersions
      summary: List the complete version history of a Coverage Policy
      x-chabok-entitlement: LiveOperations
      x-chabok-permission: network.coverage.view
      parameters: [{ $ref: '#/components/parameters/PolicyId' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PerPage' }, { $ref: '#/components/parameters/CorrelationId' }]
      responses: { '200': { $ref: '#/components/responses/CoverageVersionList' }, '401': { $ref: '#/components/responses/Unauthenticated' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Unprocessable' } }
    post:
      tags: [Coverage Policies]
      operationId: createCoveragePolicyVersion
      summary: Create or clone a draft Coverage Policy Version
      x-chabok-entitlement: LiveOperations
      x-chabok-permission: network.coverage.manage_draft
      parameters: [{ $ref: '#/components/parameters/PolicyId' }, { $ref: '#/components/parameters/CorrelationId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateCoverageVersionRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/CoverageVersionDetail' }, '401': { $ref: '#/components/responses/Unauthenticated' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/Unprocessable' } }
  /network/coverage-policies/{policy_id}/versions/{version_id}:
    get:
      tags: [Coverage Policies]
      operationId: getCoveragePolicyVersion
      summary: Get a Coverage Policy Version
      x-chabok-entitlement: LiveOperations
      x-chabok-permission: network.coverage.view

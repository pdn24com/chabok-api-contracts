      requestBody: { $ref: '#/components/requestBodies/LifecycleCommand' }
      responses: { '200': { $ref: '#/components/responses/CoverageVersionDetail' }, '401': { $ref: '#/components/responses/Unauthenticated' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/Unprocessable' } }
  /network/route-definitions:
    get:
      tags: [Route Definitions]
      operationId: listNetworkRouteDefinitions
      summary: List Route Definition identities
      x-chabok-entitlement: LiveOperations
      x-chabok-permission: network.route.view
      parameters: [{ $ref: '#/components/parameters/Search' }, { name: purpose, in: query, schema: { $ref: '#/components/schemas/RoutePurpose' } }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PerPage' }, { $ref: '#/components/parameters/CorrelationId' }]
      responses: { '200': { $ref: '#/components/responses/RouteDefinitionList' }, '401': { $ref: '#/components/responses/Unauthenticated' }, '403': { $ref: '#/components/responses/Forbidden' }, '422': { $ref: '#/components/responses/Unprocessable' } }
    post:
      tags: [Route Definitions]
      operationId: createNetworkRouteDefinition
      summary: Create a Route Definition identity
      x-chabok-entitlement: LiveOperations
      x-chabok-permission: network.route.manage_draft
      parameters: [{ $ref: '#/components/parameters/CorrelationId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateRouteDefinitionRequest' } } } }

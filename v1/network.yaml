    patch:
      tags: [Coverage Policies]
      operationId: updateCoveragePolicyVersion
      summary: Replace editable Coverage Policy Version content
      x-chabok-entitlement: LiveOperations
      x-chabok-permission: network.coverage.manage_draft
      parameters: [{ $ref: '#/components/parameters/PolicyId' }, { $ref: '#/components/parameters/VersionId' }, { $ref: '#/components/parameters/CorrelationId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateCoverageVersionRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/CoverageVersionDetail' }, '401': { $ref: '#/components/responses/Unauthenticated' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/Unprocessable' } }
  /network/coverage-policies/{policy_id}/versions/{version_id}/validate:
    post:

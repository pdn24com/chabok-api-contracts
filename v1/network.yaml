      x-chabok-entitlement: LiveOperations
      x-chabok-permission: network.route.view
      parameters: [{ $ref: '#/components/parameters/RouteDefinitionId' }, { $ref: '#/components/parameters/VersionId' }, { $ref: '#/components/parameters/CorrelationId' }]

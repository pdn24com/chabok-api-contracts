openapi: 3.1.0
info:
  title: Chabok Consignment API
  version: 1.2.0
  description: |
    Consignment production vertical-slice contract derived from the governing
    implementation baseline, current Product Owner instruction, ERS v1.7, and
    the approved List/Create/Edit/Detail Option A designs. The five-operation
    inventory and normalized multi-option legacy pricing boundary are approved
    by the current slice instructions. Legacy wire-code mappings remain
    deployment configuration and fail closed when required.
    List v1.1 adds selected-node-scoped status-group totals and operational
    node/driver identifiers required by the approved Consignment List states.
    The production adapter uses injected rotated secrets only; it never exposes
    provider tokens, credentials, URLs containing login input, or raw payloads.
servers:
  - url: /api/v1
tags:
  - name: Consignments
    description: Tenant- and operational-scope-bound Consignment operations.
  - name: Consignment Number Ranges
    description: HQ-scoped administration of preprinted numeric Consignment inventory.
security:
  - bearerAuth: []
paths:
  /operational-statuses:
    get:
      operationId: listOperationalStatuses
      summary: Visible global and tenant operational status catalogue, including inactive historical entries
      tags: [Consignments]
      responses:
        '200':
          description: Requires an operational view permission/entitlement; no cross-tenant catalogue entries.
          content:
            application/json:
              schema:
                type: object
                required: [data, correlation_id]
                properties:
                  correlation_id: { type: string, format: uuid }
                  data: { type: array, items: { $ref: '#/components/schemas/OperationalStatusEntry' } }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createOperationalStatus
      summary: Create global status as platform administrator or tenant status with operational_status.manage and tenant scope
      tags: [Consignments]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/OperationalStatusFields'
                - type: object
                  required: [code, scope]
                  properties:
                    code: { $ref: '#/components/schemas/OperationalStatus' }
                    scope: { type: string, enum: [GLOBAL, TENANT] }
      responses:
        '201':
          description: Created; code immutable, no transition is granted by creation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationalStatusSuccess' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /operational-statuses/{id}:
    patch:
      operationId: updateOperationalStatus
      tags: [Consignments]
      summary: Update owned status metadata with immutable revision and audit; system workflow semantics are protected
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/OperationalStatusFields'
                - type: object
                  required: [expected_version]
                  properties:
                    expected_version: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Saved, or unchanged without creating another revision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationalStatusSuccess' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /consignments:
    get:
      tags: [Consignments]
      operationId: listConsignments
      summary: List visible Consignments in the active operational context
      x-chabok-source: SCR-007, UF-011, ERS v1.7 E01/E02
      x-chabok-approval-status: approved-current-slice
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/NodeId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/StatusGroup'
        - $ref: '#/components/parameters/PickupNodeId'
        - $ref: '#/components/parameters/DeliveryNodeId'
        - in: query
          name: pickup_man_id
          style: form
          explode: false
          description: Comma-separated selections (OR), AND with other filters; legacy scalar accepted; empty means unrestricted.
          schema: { type: array, maxItems: 50, items: { type: string, format: uuid } }
        - in: query
          name: delivery_man_id
          style: form
          explode: false
          description: Comma-separated selections (OR), AND with other filters; legacy scalar accepted; empty means unrestricted.
          schema: { type: array, maxItems: 50, items: { type: string, format: uuid } }
        - in: query
          name: sla_risk
          style: form
          explode: false
          description: Comma-separated selections (OR), AND with other filters; legacy scalar accepted; empty means unrestricted.
          schema: { type: array, maxItems: 50, items: { type: string, enum: [OVERDUE, AT_RISK, ON_TIME, NO_COMMITMENT] } }

        - $ref: '#/components/parameters/ServiceTypeId'
        - $ref: '#/components/parameters/ShippingMethodId'
        - $ref: '#/components/parameters/CreatedFrom'
        - $ref: '#/components/parameters/CreatedTo'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Tenant- and scope-filtered page.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsignmentListSuccess'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
    post:
      tags: [Consignments]
      operationId: createConsignment
      summary: Atomically create a Consignment from an accepted pricing quote
      x-chabok-source: SCR-009, UF-001, ERS v1.7 E01/E02, current Product Owner instruction
      x-chabok-approval-status: approved-current-slice
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/NodeId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConsignmentRequest'
      responses:
        '201':
          description: Consignment, Parcels, accepted pricing, status, audit, and outbox persisted.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsignmentDetailSuccess'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/PricingUnavailable'
  /consignments/pricing-quotes:
    post:
      tags: [Consignments]
      operationId: calculateConsignmentPricing
      summary: Calculate a create or edit pricing quote without mutating the aggregate
      x-chabok-source: UF-001, UF-002, Create/Edit approved designs
      x-chabok-approval-status: approved-current-slice
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/NodeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PricingQuoteRequest'
      responses:
        '200':
          description: Non-mutating multi-option quote bundle for explicit later acceptance.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingQuoteSuccess'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/PricingUnavailable'
  /consignments/{consignment_id}:
    parameters:
      - $ref: '#/components/parameters/ConsignmentId'
    get:
      tags: [Consignments]
      operationId: getConsignment
      summary: Read Consignment Detail Option A data
      x-chabok-source: SCR-008, UF-011, approved Detail Option A
      x-chabok-approval-status: approved-current-slice
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/NodeId'
      responses:
        '200':
          description: Scope-filtered Consignment detail.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsignmentDetailSuccess'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Consignments]
      operationId: editConsignment
      summary: Edit eligible fields with optimistic concurrency and accepted repricing
      x-chabok-source: SCR-010, UF-002, approved Edit design
      x-chabok-approval-status: approved-current-slice
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/NodeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditConsignmentRequest'
      responses:
        '200':
          description: Updated Consignment with preserved pricing history.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsignmentDetailSuccess'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/PricingUnavailable'
  /admin/consignment-number-ranges:
    get:
      tags: [Consignment Number Ranges]
      operationId: listConsignmentNumberRanges
      summary: List number ranges owned by the authenticated HQ
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ConsignmentNumberRangeStatus' }
      responses:
        '200':
          description: Tenant-scoped range page.
          content: { application/json: { schema: { $ref: '#/components/schemas/ConsignmentNumberRangeListSuccess' } } }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Consignment Number Ranges]
      operationId: createConsignmentNumberRange
      summary: Revalidate and immediately activate a range under the global overlap lock
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateConsignmentNumberRangeRequest' } } }
      responses:
        '201':
          description: Range is AVAILABLE immediately.
          content: { application/json: { schema: { $ref: '#/components/schemas/ConsignmentNumberRangeSuccess' } } }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /admin/consignment-number-ranges/validate:
    post:
      tags: [Consignment Number Ranges]
      operationId: validateConsignmentNumberRange
      summary: Validate and preview a range without persistence
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ConsignmentNumberRangeDefinitionInput' } } }
      responses:
        '200':
          description: Non-persisted normalized preview, including overlap result.
          content: { application/json: { schema: { $ref: '#/components/schemas/ConsignmentNumberRangePreviewSuccess' } } }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /admin/consignment-number-ranges/{range_id}:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: range_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Consignment Number Ranges]
      operationId: getConsignmentNumberRange
      summary: Get one number range owned by the authenticated HQ
      responses:
        '200':
          description: Tenant-scoped range detail.
          content: { application/json: { schema: { $ref: '#/components/schemas/ConsignmentNumberRangeSuccess' } } }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/consignment-number-ranges/{range_id}/allocations:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: range_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Consignment Number Ranges]
      operationId: listConsignmentNumberRangeAllocations
      summary: List immutable allocations for one tenant-owned range
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Server-paginated tenant-scoped immutable allocation history.
          content: { application/json: { schema: { $ref: '#/components/schemas/ConsignmentNumberAllocationListSuccess' } } }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/consignment-number-ranges/{range_id}/disable:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: range_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Consignment Number Ranges]
      operationId: disableConsignmentNumberRange
      summary: Disable an AVAILABLE immutable range definition
      responses:
        '200':
          description: Range disabled and excluded from allocation.
          content: { application/json: { schema: { $ref: '#/components/schemas/ConsignmentNumberRangeSuccess' } } }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    CorrelationId:
      description: Request correlation identifier.
      schema:
        type: string
        format: uuid
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
        format: uuid
    NodeId:
      name: X-Node-Id
      in: header
      required: true
      description: |
        Operational context hint validated against server-resolved tenant and
        scope. It never establishes or overrides tenant identity.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    ConsignmentId:
      name: consignment_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 250
        default: 25
    Search:
      name: search
      in: query
      schema:
        type: string
        maxLength: 160
    Status:
      name: status
      in: query
      description: Comma-separated selections (OR); other filters combine with AND. Legacy scalar accepted; empty means unrestricted. Up to 50 selections.
      style: form
      explode: false
      schema:
        type: array
        maxItems: 50
        items:
            $ref: '#/components/schemas/OperationalStatus'
    StatusGroup:
      name: status_group
      in: query
      schema:
        type: string
        enum: [NEW_ROUTED, UNASSIGNED, ASSIGNED, IN_OPERATION, EXCEPTION, COMPLETED, CANCELLED]
    PickupNodeId:
      name: pickup_node_id
      in: query
      description: Comma-separated selections (OR); other filters combine with AND. Legacy scalar accepted; empty means unrestricted. Up to 50 selections.
      style: form
      explode: false
      schema:
        type: array
        maxItems: 50
        items:
            type: string
            format: uuid
    DeliveryNodeId:
      name: delivery_node_id
      in: query
      description: Comma-separated selections (OR); other filters combine with AND. Legacy scalar accepted; empty means unrestricted. Up to 50 selections.
      style: form
      explode: false
      schema:
        type: array
        maxItems: 50
        items:
            type: string
            format: uuid
    ServiceTypeId:
      name: service_type_id
      in: query
      schema:
        type: string
        format: uuid
    ShippingMethodId:
      name: shipping_method_id
      in: query
      schema:
        type: string
        format: uuid
    CreatedFrom:
      name: created_from
      in: query
      schema:
        type: string
        format: date-time
    CreatedTo:
      name: created_to
      in: query
      schema:
        type: string
        format: date-time
    Sort:
      name: sort
      in: query
      schema:
        type: string
        enum: [created_at, -created_at, updated_at, -updated_at, consignment_number, -consignment_number, current_status, -current_status]
        default: -created_at
  responses:
    AuthenticationRequired:
      description: Authentication is required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Tenant, entitlement, permission, or operational-scope access denied.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource is not visible in the tenant/scope-filtered query.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Aggregate version, identifier, or idempotency conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unprocessable:
      description: Validation, pricing acceptance, lifecycle, or domain-policy rejection.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PricingUnavailable:
      description: Production pricing provider is unavailable; no mutation occurred.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    NumericConsignmentNumber:
      type: string
      pattern: '^[0-9]{6,28}$'
      minLength: 6
      maxLength: 28
    DecimalCount:
      type: string
      pattern: '^[0-9]+$'
    ConsignmentNumberRangeStatus:
      type: string
      enum: [AVAILABLE, EXHAUSTED, DISABLED]
    ConsignmentNumberRangeDefinitionInput:
      type: object
      additionalProperties: false
      required: [numeric_prefix, total_length, serial_start, serial_end]
      properties:
        numeric_prefix: { type: string, pattern: '^[0-9]+$', maxLength: 27 }
        total_length: { type: integer, minimum: 6, maximum: 28 }
        serial_start: { type: string, pattern: '^[0-9]+$', maxLength: 28 }
        serial_end: { type: string, pattern: '^[0-9]+$', maxLength: 28 }
    CreateConsignmentNumberRangeRequest:
      type: object
      additionalProperties: false
      required: [title, numeric_prefix, total_length, serial_start, serial_end]
      properties:
        title: { type: string, maxLength: 200 }
        numeric_prefix: { type: string, pattern: '^[0-9]+$', maxLength: 27 }
        total_length: { type: integer, minimum: 6, maximum: 28 }
        serial_start: { type: string, pattern: '^[0-9]+$', maxLength: 28 }
        serial_end: { type: string, pattern: '^[0-9]+$', maxLength: 28 }
    ConsignmentNumberRangePreview:
      type: object
      additionalProperties: false
      required: [numeric_prefix, total_length, serial_width, serial_start, serial_end, first_number, last_number, total_capacity, sample_first_values, sample_final_values, overlaps_existing_range, validation_result]
      properties:
        numeric_prefix: { type: string, pattern: '^[0-9]+$' }
        total_length: { type: integer }
        serial_width: { type: integer }
        serial_start: { type: string, pattern: '^[0-9]+$' }
        serial_end: { type: string, pattern: '^[0-9]+$' }
        first_number: { $ref: '#/components/schemas/NumericConsignmentNumber' }
        last_number: { $ref: '#/components/schemas/NumericConsignmentNumber' }
        total_capacity: { $ref: '#/components/schemas/DecimalCount' }
        sample_first_values: { type: array, items: { $ref: '#/components/schemas/NumericConsignmentNumber' } }
        sample_final_values: { type: array, items: { $ref: '#/components/schemas/NumericConsignmentNumber' } }
        overlaps_existing_range: { type: boolean }
        validation_result: { type: string, enum: [VALID, OVERLAP] }
    ConsignmentNumberRange:
      type: object
      additionalProperties: false
      required: [range_id, title, numeric_prefix, total_length, serial_width, serial_start, serial_end, first_number, last_number, next_number, total_capacity, allocated_count, remaining_count, status, created_by, created_at, updated_at, disabled_by, disabled_at, exhausted_at]
      properties:
        range_id: { type: string, format: uuid }
        title: { type: string }
        numeric_prefix: { type: string, pattern: '^[0-9]+$' }
        total_length: { type: integer }
        serial_width: { type: integer }
        serial_start: { type: string, pattern: '^[0-9]+$' }
        serial_end: { type: string, pattern: '^[0-9]+$' }
        first_number: { $ref: '#/components/schemas/NumericConsignmentNumber' }
        last_number: { $ref: '#/components/schemas/NumericConsignmentNumber' }
        next_number: { oneOf: [{ $ref: '#/components/schemas/NumericConsignmentNumber' }, { type: 'null' }] }
        total_capacity: { $ref: '#/components/schemas/DecimalCount' }
        allocated_count: { $ref: '#/components/schemas/DecimalCount' }
        remaining_count: { $ref: '#/components/schemas/DecimalCount' }
        status: { $ref: '#/components/schemas/ConsignmentNumberRangeStatus' }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        disabled_by: { type: [string, 'null'], format: uuid }
        disabled_at: { type: [string, 'null'], format: date-time }
        exhausted_at: { type: [string, 'null'], format: date-time }
    ConsignmentNumberAllocation:
      type: object
      additionalProperties: false
      required: [allocation_id, range_id, consignment_id, consignment_number, allocated_by, allocated_at, correlation_id]
      properties:
        allocation_id: { type: string, format: uuid }
        range_id: { type: string, format: uuid }
        consignment_id: { type: string, format: uuid }
        consignment_number: { $ref: '#/components/schemas/NumericConsignmentNumber' }
        allocated_by: { type: string, format: uuid }
        allocated_at: { type: string, format: date-time }
        correlation_id: { type: string, format: uuid }
    ConsignmentNumberRangeSuccess:
      type: object
      required: [data, meta, correlation_id]
      properties: { data: { $ref: '#/components/schemas/ConsignmentNumberRange' }, meta: { type: object }, correlation_id: { type: string, format: uuid } }
    ConsignmentNumberRangePreviewSuccess:
      type: object
      required: [data, meta, correlation_id]
      properties: { data: { $ref: '#/components/schemas/ConsignmentNumberRangePreview' }, meta: { type: object }, correlation_id: { type: string, format: uuid } }
    ConsignmentNumberRangeListSuccess:
      type: object
      required: [data, meta, correlation_id]
      properties: { data: { type: array, items: { $ref: '#/components/schemas/ConsignmentNumberRange' } }, meta: { type: object }, correlation_id: { type: string, format: uuid } }

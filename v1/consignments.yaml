              type: string
              enum: [SENDER, RECEIVER, VENDOR]
            payment_method:
              type: string
              enum: [CASH, CREDIT, COD]
            parcels:
              type: array
              items:
                $ref: '#/components/schemas/Parcel'
            accepted_pricing_versions:
              type: array
              items:
                $ref: '#/components/schemas/AcceptedPricingVersion'
            status_timeline:
              type: array
              items:
                $ref: '#/components/schemas/StatusTimelineItem'
            audit_timeline:
              type: array
              items:
                $ref: '#/components/schemas/AuditTimelineItem'
            related_manifests:
              type: array
              items:
                type: object
                additionalProperties: true
                required: [manifest_id, manifest_number]
                properties:
                  manifest_id:
                    type: string
                    format: uuid
                  manifest_number:
                    type: string
            current_location:
              type: object
              additionalProperties: false
              required: [state, node, custody_type, custodian_id]
              properties:
                state: { type: string, enum: [AT_NODE, IN_CUSTODY, MIXED] }
                node:
                  oneOf:
                    - $ref: '#/components/schemas/JourneyNode'
                    - type: 'null'
                custody_type: { type: string, enum: [NODE, PICKUP_DRIVER, LINEHAUL_DRIVER, DELIVERY_DRIVER, RECIPIENT, MIXED] }
                custodian_id: { type: [string, 'null'], format: uuid }
            journey:
              $ref: '#/components/schemas/ConsignmentJourney'
            permitted_actions:
              type: array
              items:
                type: string
                enum: [EDIT]
    JourneyNode:
      type: object
      additionalProperties: false
      required: [node_id, node_code, node_title]
      properties:
        node_id: { type: string, format: uuid }
        node_code: { type: string }
        node_title: { type: string }
    ConsignmentJourney:
      type: object
      additionalProperties: false
      required: [route_plan, route_legs, movement_manifests, custody_timeline]
      properties:
        route_plan:
          type: [object, 'null']
          additionalProperties: true
        route_legs:
          type: array
          items:
            type: object
            additionalProperties: true
            required: [route_plan_leg_id, leg_order, status, origin_node, destination_node]
            properties:
              route_plan_leg_id: { type: string, format: uuid }
              leg_order: { type: integer, minimum: 1 }
              status: { type: string }
              origin_node: { $ref: '#/components/schemas/JourneyNode' }
              destination_node: { $ref: '#/components/schemas/JourneyNode' }
              routed_at: { type: [string, 'null'], format: date-time }
              received_at: { type: [string, 'null'], format: date-time }
        movement_manifests:
          type: array
          items:
            type: object
            additionalProperties: true
            required: [manifest_id, manifest_number, manifest_status, manifest_type, operational_context_type, route_plan_id, route_plan_leg_id, assigned_driver_id, assigned_vehicle_id, state, event_type, recorded_at]
            properties:
              manifest_id: { type: string, format: uuid }
              manifest_number: { type: string }
              manifest_status: { type: string, enum: [OS, IR] }
              manifest_type: { type: string }
              operational_context_type: { type: string, enum: [LINEHAUL_DEPARTURE, MOVEMENT_RECEPTION] }
              route_plan_id: { type: string, format: uuid }
              route_plan_leg_id: { type: string, format: uuid }
              assigned_driver_id: { type: string, format: uuid }
              assigned_vehicle_id: { type: string, format: uuid }
              state: { type: string, const: CLOSED }
              event_type: { type: string, enum: [DEPARTED, RECEIVED] }
              recorded_at: { type: string, format: date-time }
        custody_timeline:
          type: array
          items: { type: object, additionalProperties: true }
    ConsignmentStatusCounts:
      type: object
      additionalProperties: false
      required:
        - total
        - new_routed
        - unassigned
        - assigned
        - in_operation
        - exception
        - completed
        - cancelled
      properties:
        total:
          type: integer
          minimum: 0
        new_routed:
          type: integer
          minimum: 0
        unassigned:
          type: integer
          minimum: 0
        assigned:
          type: integer
          minimum: 0
        in_operation:
          type: integer
          minimum: 0
        exception:
          type: integer
          minimum: 0
        completed:
          type: integer
          minimum: 0
        cancelled:
          type: integer
          minimum: 0
    ConsignmentListMeta:
      type: object
      additionalProperties: false
      required: [pagination, status_counts]
      properties:
        pagination:
          type: object
          additionalProperties: false
          required: [page, page_size, total, total_pages]
          properties:
            page:
              type: integer
            page_size:
              type: integer
            total:
              type: integer
            total_pages:
              type: integer
        filter_options:
          type: object
          description: Assigned agents on consignments visible in the current tenant and node, including historical inactive agents.
          properties:
            pickup_agents:
              type: array
              items:
                type: object
                required: [value, label]
                properties:
                  value: { type: string, format: uuid }
                  label: { type: string }
            delivery_agents:
              type: array
              items:
                type: object
                required: [value, label]
                properties:
                  value: { type: string, format: uuid }
                  label: { type: string }
        status_counts:
          $ref: '#/components/schemas/ConsignmentStatusCounts'
    ConsignmentListSuccess:
      type: object
      additionalProperties: false
      required: [data, meta, correlation_id]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ConsignmentListItem'
        meta:
          $ref: '#/components/schemas/ConsignmentListMeta'
        correlation_id:
          type: string
          format: uuid
    ConsignmentDetailSuccess:
      type: object
      additionalProperties: false
      required: [data, meta, correlation_id]
      properties:
        data:
          $ref: '#/components/schemas/ConsignmentDetail'
        meta:
          type: object
        correlation_id:
          type: string
          format: uuid
    PricingQuoteSuccess:
      type: object
      additionalProperties: false
      required: [data, meta, correlation_id]
      properties:
        data:
          $ref: '#/components/schemas/PricingQuote'
        meta:
          type: object
        correlation_id:
          type: string
          format: uuid
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error_code, message, field_errors, details, correlation_id]
      properties:
        error_code:
          type: string
          enum:
            - VALIDATION_ERROR
            - AUTHENTICATION_REQUIRED
            - TENANT_ACCESS_DENIED
            - ENTITLEMENT_DISABLED
            - PERMISSION_DENIED
            - SCOPE_ACCESS_DENIED
            - RESOURCE_NOT_FOUND
            - VERSION_CONFLICT
            - IDEMPOTENCY_KEY_REUSED
            - CONSIGNMENT_NOT_EDITABLE
            - CONSIGNMENT_NUMBER_INVALID_FORMAT
            - CONSIGNMENT_NUMBER_INVALID_LENGTH
            - CONSIGNMENT_NUMBER_PREFIX_LENGTH_INCOMPATIBLE
            - CONSIGNMENT_NUMBER_INVALID_BOUNDARIES
            - CONSIGNMENT_NUMBER_RANGE_OVERLAP
            - CONSIGNMENT_NUMBER_RANGE_UNAVAILABLE
            - CONSIGNMENT_NUMBER_RANGE_EXHAUSTED
            - PRICING_UNAVAILABLE
            - PRICING_REJECTED
            - PRICING_QUOTE_EXPIRED
            - PRICING_QUOTE_MISMATCH
        message:
          type: string
        field_errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        details:
          type: object
        correlation_id:
          type: string
          format: uuid
